<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════════
     HeroUI v3 기본 테마 — React·Tailwind 없이 순수 CSS로 옮긴 것.
     토큰 이름과 값은 @heroui/styles 3.2.5 의 themes/default/variables.css 를 따릅니다.
     주의: HeroUI 의 --muted 는 바탕색이 아니라 '흐린 글자' 색입니다.
     바탕 단계는 --background(페이지) · --surface(카드) · --surface-secondary(카드 속 칸)
     · --default(칩·버튼·탭 바탕) 입니다.
     ══════════════════════════════════════════════════════════════ */
  :root{
    --white:oklch(100% 0 0);
    --snow:oklch(.9911 0 0);
    --eclipse:oklch(.2103 .0059 285.89);

    --background:oklch(.9702 0 0);
    --foreground:var(--eclipse);
    --surface:var(--white);
    --surface-secondary:oklch(.9524 .0013 286.37);
    --muted:oklch(.5517 .0138 285.94);
    --default:oklch(94% .001 286.375);
    --default-foreground:var(--eclipse);
    --segment:var(--white);
    --segment-foreground:var(--eclipse);
    --accent:oklch(.6204 .195 253.83);
    --success:oklch(.7329 .1935 150.81);
    --danger:oklch(.6532 .2328 25.74);
    --border:oklch(90% .004 286.32);
    --separator:oklch(92% .004 286.32);
    --focus:var(--accent);
    --surface-shadow:0 2px 4px 0 rgba(0,0,0,.04),0 1px 2px 0 rgba(0,0,0,.06),0 0 1px 0 rgba(0,0,0,.06);
    --overlay-shadow:0 2px 8px 0 rgba(0,0,0,.06),0 -6px 12px 0 rgba(0,0,0,.03),0 14px 28px 0 rgba(0,0,0,.08);

    /* 섞어 만드는 색 — 같은 :root 에서 풀리므로 테마가 바뀌면 따라 바뀝니다 */
    --default-hover:color-mix(in oklab,var(--default) 96%,var(--default-foreground) 4%);
    --border-secondary:color-mix(in oklab,var(--surface) 78%,var(--foreground) 22%);
    --accent-soft:color-mix(in oklab,var(--accent) 15%,transparent);
    --danger-soft:color-mix(in oklab,var(--danger) 15%,transparent);
    --danger-soft-foreground:color-mix(in oklab,var(--danger) 70%,var(--foreground) 40%);
    --success-soft-foreground:color-mix(in oklab,var(--success) 80%,var(--foreground) 60%);

    /* 반지름 — HeroUI 는 --radius 하나에서 단계를 곱해 만듭니다 */
    --radius:.5rem;
    --radius-2xl:calc(var(--radius) * 2);          /* 16px — 카드 속 칸·지도 */
    --radius-card:min(32px,calc(var(--radius) * 3)); /* 24px — Card·Alert·Accordion */

    /* 한글이 섞여도 깨지지 않게: 라틴·숫자는 모노, 한글은 본문 글꼴로 떨어집니다 */
    --font-sans:Inter,"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --font-mono:"JetBrains Mono","IBM Plex Sans KR",ui-monospace,SFMono-Regular,
      Menlo,"Malgun Gothic",monospace;
    --map-water:31 111 165;
    --map-road:94 80 68;
    --map-bord:36 30 34;
    --map-a-sea:.13; --map-a-water:.17; --map-a-riv:.34; --map-a-coast:.45;
    --map-a-r1:.34; --map-a-r2:.26; --map-a-r3:.21; --map-a-r4:.17; --map-a-r5:.15;
    --map-a-bord:.38;
    color-scheme:light dark;
  }
  :root[data-theme="light"]{color-scheme:light;}
  /* OS 가 다크이고, 사용자가 라이트를 명시하지 않았을 때 */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --background:oklch(12% .005 285.823);
      --foreground:var(--snow);
      --surface:oklch(.2103 .0059 285.89);
      --surface-secondary:oklch(.257 .0037 286.14);
      --muted:oklch(70.5% .015 286.067);
      --default:oklch(27.4% .006 286.033);
      --default-foreground:var(--snow);
      --segment:oklch(.3964 .01 285.93);
      --segment-foreground:var(--snow);
      --danger:oklch(.594 .1967 24.63);
      --border:oklch(28% .006 286.033);
      --separator:oklch(25% .006 286.033);
      --surface-shadow:0 0 0 0 transparent inset;
      --overlay-shadow:0 0 1px 0 rgba(255,255,255,.3) inset;
      --accent-soft:color-mix(in oklab,var(--accent) 12%,transparent);
      --danger-soft-foreground:color-mix(in oklab,var(--danger) 80%,var(--foreground) 30%);
      --success-soft-foreground:color-mix(in oklab,var(--success) 80%,var(--foreground) 30%);
      --map-water:126 193 232;
      --map-road:226 216 206;
      --map-bord:239 233 228;
      --map-a-sea:.11; --map-a-water:.13; --map-a-riv:.30; --map-a-coast:.34;
      --map-a-r1:.28; --map-a-r2:.21; --map-a-r3:.16; --map-a-r4:.13; --map-a-r5:.11;
      --map-a-bord:.34;
      color-scheme:dark;
    }
  }
  /* 사용자가 다크를 명시했을 때 — OS 설정을 이깁니다 */
  :root[data-theme="dark"]{
      --background:oklch(12% .005 285.823);
      --foreground:var(--snow);
      --surface:oklch(.2103 .0059 285.89);
      --surface-secondary:oklch(.257 .0037 286.14);
      --muted:oklch(70.5% .015 286.067);
      --default:oklch(27.4% .006 286.033);
      --default-foreground:var(--snow);
      --segment:oklch(.3964 .01 285.93);
      --segment-foreground:var(--snow);
      --danger:oklch(.594 .1967 24.63);
      --border:oklch(28% .006 286.033);
      --separator:oklch(25% .006 286.033);
      --surface-shadow:0 0 0 0 transparent inset;
      --overlay-shadow:0 0 1px 0 rgba(255,255,255,.3) inset;
      --accent-soft:color-mix(in oklab,var(--accent) 12%,transparent);
      --danger-soft-foreground:color-mix(in oklab,var(--danger) 80%,var(--foreground) 30%);
      --success-soft-foreground:color-mix(in oklab,var(--success) 80%,var(--foreground) 30%);
      --map-water:126 193 232;
      --map-road:226 216 206;
      --map-bord:239 233 228;
      --map-a-sea:.11; --map-a-water:.13; --map-a-riv:.30; --map-a-coast:.34;
      --map-a-r1:.28; --map-a-r2:.21; --map-a-r3:.16; --map-a-r4:.13; --map-a-r5:.11;
      --map-a-bord:.34;
      color-scheme:dark;
  }

  *{box-sizing:border-box;border-color:var(--border);}
  html{-webkit-text-size-adjust:100%;background:var(--background);}
  body{
    margin:0;background:var(--background);color:var(--foreground);
    font-family:var(--font-sans);
    font-weight:400;font-size:14px;line-height:1.6;
    -webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11";
  }
  .wrap{max-width:820px;margin:0 auto;padding:56px 24px 96px;min-height:100vh;}
  html,body{overflow-x:hidden;}   /* 무슨 일이 있어도 가로 스크롤은 만들지 않습니다 */
  ::selection{background:var(--accent-soft);}

  /* ── 머리말 ───────────────────────────────────────────── */
  /* Chip — default */
  .eyebrow{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;
    margin:0 0 16px;border-radius:9999px;background:var(--default);
    color:var(--default-foreground);font-size:12px;font-weight:500;line-height:1.4;}
  .title{font-size:clamp(30px,5.4vw,44px);line-height:1.15;margin:0 0 10px;
    font-weight:700;letter-spacing:-.028em;color:var(--foreground);}
  .title .sep{color:var(--muted);padding:0 .12em;font-weight:400;}
  .subtitle{font-size:14px;color:var(--muted);margin:0 0 14px;letter-spacing:-.005em;}
  .standfirst{font-size:15px;line-height:1.7;color:var(--muted);
    margin:0 0 36px;max-width:64ch;}

  /* ── Card — 숙박 배분 ─────────────────────────────────── */
  .summary{background:var(--surface);color:var(--foreground);
    border-radius:var(--radius-card);box-shadow:var(--surface-shadow);
    padding:22px 24px 20px;margin-bottom:8px;}
  .sum-head{display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .sum-head h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .sum-total{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  /* ProgressBar */
  .bar-row{display:grid;grid-template-columns:88px minmax(0,1fr) 30px;align-items:center;
    gap:12px;margin-bottom:8px;}
  .bar-name{font-size:13px;color:var(--muted);}
  .bar-track{height:8px;background:var(--default);border-radius:9999px;overflow:hidden;}
  .bar-fill{height:100%;display:block;border-radius:9999px;background:var(--accent);}
  .bar-fill.air{background:repeating-linear-gradient(90deg,
    var(--muted) 0 3px,transparent 3px 7px);}
  .bar-num{font-family:var(--font-mono);font-size:12px;
    color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;
    color:var(--muted);margin-top:16px;padding-top:14px;
    border-top:1px solid var(--separator);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .swatch{width:9px;height:9px;display:inline-block;border-radius:9999px;}
  .swatch.air{background:var(--muted);}

  /* 나라·지역별 색 — colors 에서 자동 생성됩니다 */
__COLORCSS__

  /* ── Tabs — 나라별 보기 (라디오 + :checked, 자바스크립트 없음) ── */
__VIEWCSS__
  .tabs{display:flex;gap:2px;flex-wrap:wrap;margin:26px 0 30px;padding:4px;
    background:var(--default);border-radius:calc(var(--radius) * 2.5);
    transition:box-shadow .15s;}
  .tab{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;
    border-radius:9999px;font-size:13.5px;font-weight:500;
    color:var(--muted);cursor:pointer;
    -webkit-user-select:none;user-select:none;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .15s,color .15s,box-shadow .15s;}
  .tab:hover{color:var(--foreground);}
  .tab .swatch{width:8px;height:8px;flex:none;}
  /* 키보드로 라디오에 들어오면 탭 묶음 전체에 포커스 링 */
  .vsw:focus-visible~.tabs{box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--focus);}

  /* 나라 카드 — 홈에서 눌러 들어갑니다. 색 점은 build.py 가 --cc 로 넣습니다 */
  .ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .ccard{display:flex;flex-direction:column;gap:2px;padding:16px 20px;cursor:pointer;
    background:var(--surface);color:var(--foreground);
    border-radius:var(--radius-card);box-shadow:var(--surface-shadow);
    -webkit-tap-highlight-color:transparent;
    transition:box-shadow .2s,transform .25s;}
  .ccard:hover{box-shadow:var(--overlay-shadow);}
  .ccard:active{transform:scale(.98);}
  .cc-name{display:flex;align-items:center;gap:8px;
    font-size:15px;font-weight:600;letter-spacing:-.015em;}
  .cc-name::before{content:"";width:8px;height:8px;border-radius:9999px;flex:none;
    background:var(--cc,var(--muted));}
  .cc-span,.cc-num{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);}
  .cc-city{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}

  /* ── 이동 수단 — Accordion(surface) ───────────────────── */
__MOVECSS__
  .ic{width:22px;height:22px;flex:none;}
  /* 여닫기는 details 요소가 합니다 — CSS 로 숨기지 않으므로 새어 나올 수 없습니다 */
  .mvbox{display:flex;flex-direction:column;background:var(--surface);
    border-radius:var(--radius-card);box-shadow:var(--surface-shadow);overflow:hidden;}
  .mvitem{color:var(--foreground);}
  .mvitem+.mvitem{border-top:1px solid var(--separator);}
  .mvcard{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;
    list-style:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;transition:background-color .15s;}
  .mvcard::-webkit-details-marker{display:none;}
  .mvcard::marker{content:"";}
  .mvitem:not([open]) .mvcard:hover{background:var(--default);}
  .mvcard:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}
  .mvcard .ic{width:22px;height:22px;color:var(--muted);transition:color .15s;}
  .mvitem[open] .mvcard .ic{color:var(--accent);}
  .mvcard b{font-size:15px;font-weight:600;letter-spacing:-.015em;}
  /* 개수 — Chip */
  .mvn{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:9999px;
    background:var(--default);color:var(--muted);font-size:11.5px;font-weight:500;
    font-variant-numeric:tabular-nums;}
  /* 오른쪽 끝 꺾쇠 — 열리면 위를 봅니다 */
  .mvchev{margin-left:auto;width:8px;height:8px;flex:none;
    border-right:1.8px solid var(--muted);border-bottom:1.8px solid var(--muted);
    transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s;}
  .mvitem[open] .mvchev{transform:rotate(-135deg) translate(-2px,-2px);}
  .mvlist{border-top:1px solid var(--separator);}
  .mvr{display:grid;grid-template-columns:78px minmax(0,1fr) 88px;gap:12px;
    align-items:baseline;padding:11px 20px;border-top:1px solid var(--separator);}
  .mvr:first-child{border-top:0;}
  .mvnote{background:var(--surface-secondary);}
  .mvnote .mvb{font-size:12.5px;color:var(--muted);}
  .mvd{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  .mvb{font-size:13.5px;color:var(--foreground);line-height:1.55;overflow-wrap:anywhere;}
  .mvb b{font-weight:600;}
  .mvb small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.55;}
  .mva{font-family:var(--font-mono);font-size:12.5px;text-align:right;
    font-variant-numeric:tabular-nums;color:var(--foreground);}

  /* ── 하루씩 훑어보기 — 개요에서 16일을 한 화면에 ─────── */
  .tline{background:var(--surface);border-radius:var(--radius-card);
    box-shadow:var(--surface-shadow);overflow:hidden;}
  .tl{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;align-items:baseline;
    padding:9px 20px;border-top:1px solid var(--separator);cursor:pointer;
    color:inherit;text-decoration:none;transition:background-color .12s;}
  .tl:first-child{border-top:0;padding-top:12px;}
  .tl:last-child{padding-bottom:12px;}
  .tl:hover{background:var(--default);}
  .tl:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}
  /* 눌러서 온 날짜는 화면 위에 붙지 않게 여백을 두고, 포커스 링으로 표시합니다 */
  .day{scroll-margin-top:18px;}
  .day:target .day-body{box-shadow:0 0 0 2px var(--background),0 0 0 4px var(--focus),var(--surface-shadow);}
  .tl-d{font-family:var(--font-mono);font-size:12px;font-weight:500;
    color:var(--foreground);border-left:3px solid transparent;
    padding-left:9px;margin-left:-9px;}
  .tl-d em{font-style:normal;color:var(--muted);margin-left:4px;}
  .tl-p{font-size:13.5px;color:var(--foreground);line-height:1.5;}

  /* ── 예상경비 ─────────────────────────────────────────── */
  .bar-name small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;
    margin-bottom:8px;}
  .kpi{display:flex;flex-direction:column;gap:3px;padding:16px 20px;
    background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--surface-shadow);}
  .kpi-l{font-size:12.5px;color:var(--muted);}
  .kpi-v{font-family:var(--font-mono);font-size:19px;font-weight:500;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--foreground);}
  .kpi-s{font-size:11.5px;color:var(--muted);min-height:1em;}
  .kpi.good .kpi-v{color:var(--success-soft-foreground);}
  .kpi.bad .kpi-v{color:var(--danger-soft-foreground);}

  /* 일자별 표 */
  .ctab{background:var(--surface);border-radius:var(--radius-card);
    box-shadow:var(--surface-shadow);overflow:hidden;}
  .ctr{display:grid;grid-template-columns:64px minmax(0,1fr) 92px 92px;gap:12px;
    padding:11px 20px;border-top:1px solid var(--separator);align-items:baseline;}
  .ctr:first-child{border-top:0;}
  .chead,.cfoot{background:var(--surface-secondary);font-size:12px;font-weight:600;
    color:var(--muted);}
  .chead span:nth-child(3),.chead span:nth-child(4),
  .cfoot span:nth-child(3),.cfoot span:nth-child(4){text-align:right;}
  .cfoot{color:var(--foreground);}
  .cdate{font-family:var(--font-mono);font-size:12px;font-weight:500;
    color:var(--foreground);border-left:3px solid transparent;padding-left:8px;
    margin-left:-8px;}
  .cdate em{font-style:normal;color:var(--muted);margin-left:4px;}
  .cdesc{font-size:13px;color:var(--foreground);line-height:1.5;}
  .cdesc small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.55;}
  .cnum{font-family:var(--font-mono);font-size:12.5px;text-align:right;
    font-variant-numeric:tabular-nums;color:var(--foreground);}
  .cnum small{display:block;font-size:11px;color:var(--muted);margin-top:2px;}
  .cacc{color:var(--muted);}
  .ctr.d3{grid-template-columns:56px minmax(0,1fr) 104px;}   /* 구간별 교통비·입장료 */
  .cfree{font-family:var(--font-sans);font-size:11.5px;color:var(--muted);}

  /* 환율 */
  .rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;}
  .rate{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    padding:11px 16px;background:var(--surface);border-radius:var(--radius-2xl);
    box-shadow:var(--surface-shadow);}
  .rate b{font-family:var(--font-mono);font-size:12.5px;font-weight:500;color:var(--foreground);}
  .rate span{font-family:var(--font-mono);font-size:12.5px;
    color:var(--muted);font-variant-numeric:tabular-nums;}

  /* 나라가 바뀌는 자리의 머리글 */
  .rgn-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
    margin:40px 0 16px;padding-bottom:11px;border-bottom:1px solid var(--border);}
  .rgn-head:first-of-type{margin-top:8px;}
  .rgn-head .swatch{width:9px;height:9px;align-self:center;}
  .rgn-head b{font-size:17px;font-weight:600;letter-spacing:-.022em;color:var(--foreground);}
  .rgn-head span{font-family:var(--font-mono);font-size:12px;color:var(--muted);}

  /* ── 구획 제목 ────────────────────────────────────────── */
  /* 한글 제목이라 모노·대문자·자간을 걷어냈습니다 — 그러면 글꼴이 섞여 이상해집니다 */
  .section-label{font-size:13px;font-weight:600;letter-spacing:-.01em;
    color:var(--muted);margin:44px 0 14px;}

  /* ── 항공편(move_groups 가 없을 때) — 한 덩어리 Card ─── */
  /* 앞뒤 형제가 섞여 있어 :first-of-type 이 안 맞으므로 이웃 관계로 모서리를 고릅니다 */
  .flight{display:grid;grid-template-columns:78px minmax(0,1fr);gap:16px;padding:13px 20px;
    background:var(--surface);box-shadow:var(--surface-shadow);font-size:14px;}
  .flight+.flight{border-top:1px solid var(--separator);}
  .flight:first-child,:not(.flight)+.flight{border-top-left-radius:var(--radius-card);border-top-right-radius:var(--radius-card);}
  .flight:not(:has(+.flight)){border-bottom-left-radius:var(--radius-card);border-bottom-right-radius:var(--radius-card);}
  .flight-date{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:2px;}
  .flight-body{color:var(--muted);}
  .flight-body b{font-weight:600;color:var(--foreground);}

  /* ── 날짜 블록 ────────────────────────────────────────── */
  .day{display:grid;grid-template-columns:74px 26px minmax(0,1fr);}
  .day-date{font-family:var(--font-mono);font-size:12.5px;
    font-weight:500;color:var(--foreground);padding:26px 12px 0 0;text-align:right;line-height:1.4;}
  .day-date em{display:block;font-style:normal;font-size:11px;font-weight:400;color:var(--muted);}
  .day-rail{position:relative;}
  .day-rail::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;
    background:var(--border);}
  .day:first-of-type .day-rail::before{top:30px;}
  .day.last .day-rail::before{bottom:auto;height:32px;}
  .node{position:absolute;left:5px;top:26px;width:12px;height:12px;
    background:var(--background);border:2px solid var(--border);
    border-radius:9999px;z-index:2;box-shadow:0 0 0 3px var(--background);}
  .day.stay .node{background:var(--foreground);}

  /* 하루 = Card */
  .day-body{margin:14px 0 18px;padding:20px 24px 22px;
    background:var(--surface);color:var(--foreground);
    border-radius:var(--radius-card);box-shadow:var(--surface-shadow);
    transition:box-shadow .2s;}
  .day-place{font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:-.018em;}
  .day-sub{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.65;}

  /* ── 시간표 ───────────────────────────────────────────── */
  .sched{list-style:none;margin:0;padding:0;}
  .sched li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;
    padding:7px 0;font-size:13.5px;border-top:1px solid var(--separator);}
  .sched li:first-child{border-top:0;}
  .sched .t{font-family:var(--font-mono);font-size:12px;
    font-variant-numeric:tabular-nums;color:var(--muted);padding-top:2px;}
  .sched .a{color:var(--foreground);line-height:1.6;}
  .sched .a small{display:block;font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:3px;}

  /* ── Chip ─────────────────────────────────────────────── */
  /* .bus 는 나라 색 soft chip — 색은 build.py 가 넣습니다 */
  .bus{display:inline-flex;align-items:center;min-height:20px;padding:0 8px;margin-right:6px;
    border-radius:9999px;background:var(--default);color:var(--default-foreground);
    font-size:11.5px;font-weight:500;line-height:1.4;white-space:nowrap;vertical-align:1px;}
  .tag{display:inline-flex;align-items:center;min-height:20px;padding:0 8px;margin-left:8px;
    border-radius:9999px;background:var(--default);color:var(--default-foreground);
    font-size:11.5px;font-weight:500;line-height:1.4;white-space:nowrap;vertical-align:1px;}
  .tag.hot{background:var(--danger-soft);color:var(--danger-soft-foreground);font-weight:600;}

  /* ── Alert — 주의 박스 ────────────────────────────────── */
  /* 카드 속에서는 한 단계 낮은 surface, 페이지 바탕 위(예상경비)에서는 Card 와 같은 surface */
  .flag{margin-top:14px;padding:12px 16px;border-radius:var(--radius-2xl);
    background:var(--surface-secondary);color:var(--foreground);
    font-size:13px;line-height:1.65;}
  .flag b{font-weight:600;}
  .flag+.flag{margin-top:8px;}
  .cost>.flag{background:var(--surface);box-shadow:var(--surface-shadow);
    border-radius:var(--radius-card);padding:14px 20px;}

  /* ── 국경·이동 구분선 ─────────────────────────────────── */
  .border{display:grid;grid-template-columns:74px 26px minmax(0,1fr);margin:2px 0;}
  .border-rail{position:relative;}
  .border-rail::before{content:"";position:absolute;left:4px;top:50%;width:14px;height:2px;
    background:var(--border);}
  .border-body{margin:6px 0;padding:14px 20px;border:1px dashed var(--border-secondary);
    border-radius:var(--radius-2xl);}
  .border-title{font-size:13px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;
    color:var(--foreground);}
  .border-note{font-size:12.5px;color:var(--muted);margin:0;line-height:1.65;}

  /* ── 확인사항 — 한 덩어리 Card ────────────────────────── */
  .notes{margin-top:56px;}
  .notes h2{font-size:20px;font-weight:600;margin:0 0 18px;letter-spacing:-.02em;
    color:var(--foreground);}
  .note{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:14px 20px;
    background:var(--surface);box-shadow:var(--surface-shadow);}
  .note+.note{border-top:1px solid var(--separator);}
  .note:first-child,:not(.note)+.note{border-top-left-radius:var(--radius-card);border-top-right-radius:var(--radius-card);}
  .note:not(:has(+.note)){border-bottom-left-radius:var(--radius-card);border-bottom-right-radius:var(--radius-card);}
  .note-key{font-size:12.5px;font-weight:600;color:var(--foreground);padding-top:1px;}
  .note-val{font-size:13px;color:var(--muted);line-height:1.7;}
  .note-val b{font-weight:600;color:var(--foreground);}
  .foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--border);
    font-size:12px;color:var(--muted);}

  .opt-label{font-size:12.5px;font-weight:600;color:var(--muted);
    margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--separator);}

  /* ── 일자별 경로 지도 (인라인 SVG · 오프라인) ─────────── */
  .daymap{margin:18px 0 2px;}
  .mapsvg{display:block;width:100%;height:auto;border:1px solid var(--separator);
    border-radius:var(--radius-2xl);background:var(--surface-secondary);}
  .mapbg{fill:transparent;}
  .maplbl{font-family:var(--font-sans);paint-order:stroke;
    stroke:var(--surface);stroke-width:2.8px;stroke-linejoin:round;}
  .maplbl.town{font-size:8.5px;fill:var(--muted);}
  .maplbl.stop{font-size:10px;font-weight:600;fill:var(--foreground);}
  .maplbl.lake{font-size:9px;fill:rgb(var(--map-water));opacity:.8;text-anchor:middle;}
  .maptown{fill:var(--muted);opacity:.55;}
  .mapn{font-family:var(--font-mono);font-size:10.5px;
    font-weight:600;fill:#fff;text-anchor:middle;}
  .mapsm{font-family:var(--font-mono);font-size:9.5px;fill:var(--muted);}
  .mapscale{stroke:var(--muted);stroke-width:1;}
  .mapseq{font-size:12.5px;line-height:1.8;color:var(--muted);margin:10px 0 0;}
  .mapseq b{font-family:var(--font-mono);font-size:10.5px;
    color:var(--foreground);font-weight:600;margin-right:2px;}
  .mapdot{color:var(--border);margin:0 3px;}
  .mapcap{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.65;}
  .mapctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 0;}
  /* Button — tertiary / ghost (sm) */
  .maptog{display:inline-flex;align-items:center;justify-content:center;height:32px;
    padding:0 14px;font-family:inherit;font-size:13px;font-weight:500;
    color:var(--default-foreground);background:var(--default);
    border:0;border-radius:9999px;cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:background-color .1s,box-shadow .1s,transform .25s;}
  .maptog:hover{background:var(--default-hover);}
  .maptog:active{transform:scale(.97);}
  .maptog:focus-visible{outline:none;box-shadow:0 0 0 2px var(--focus);}
  .maptog[disabled]{opacity:.5;cursor:not-allowed;transform:none;}
  .maplink{display:inline-flex;align-items:center;height:32px;padding:0 12px;
    font-size:13px;font-weight:500;color:var(--muted);
    text-decoration:none;border-radius:9999px;
    transition:background-color .1s,color .1s;}
  .maplink:hover{background:var(--default);color:var(--foreground);}
  .maplink:focus-visible{outline:none;box-shadow:0 0 0 2px var(--focus);}
  .leafbox{height:320px;border:1px solid var(--separator);border-radius:var(--radius-2xl);}
  .mapnum{display:flex;align-items:center;justify-content:center;width:22px;height:22px;
    border-radius:50%;color:#fff;font-family:var(--font-mono);
    font-size:10.5px;font-weight:600;background:#42606E;
    /* 흰 테두리만 두면 밝은 타일 위에서 사라져서, 바깥에 옅은 검은 테두리를 한 겹 더 둡니다 */
    box-shadow:0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.35);}
  /* 관광지 이름 → 구글 지도 (점선 밑줄이 링크 표시입니다) */
  .gmap{color:inherit;text-decoration:none;
    border-bottom:1px dashed var(--muted);
    text-underline-offset:3px;transition:color .15s,border-color .15s;}
  .gmap:hover,.gmap:focus{color:var(--accent);border-bottom-color:var(--accent);}
  .leaflet-container{font:inherit;border-radius:var(--radius-2xl);}
  .leaflet-control-attribution{font-size:9px !important;}

  /* ── 오프라인 벡터 배경지도 · Natural Earth 10m + OSM ─── */
  .bm{pointer-events:none;}
  .bm>path{stroke-linecap:round;stroke-linejoin:round;}
  .bm-sea,.bm-water{stroke:none;}
  .bm-riv,.bm-coast,.bm-r1,.bm-r2,.bm-r3,.bm-r4,.bm-r5,.bm-bord{fill:none;}
  .bm-sea{fill:rgb(var(--map-water)/var(--map-a-sea));}
  .bm-water{fill:rgb(var(--map-water)/var(--map-a-water));}
  .bm-riv{stroke:rgb(var(--map-water)/var(--map-a-riv));stroke-width:.8;}
  .bm-coast{stroke:rgb(var(--map-water)/var(--map-a-coast));stroke-width:.7;}
  .bm-r1{stroke:rgb(var(--map-road)/var(--map-a-r1));stroke-width:1.5;}   /* 고속·간선 */
  .bm-r2{stroke:rgb(var(--map-road)/var(--map-a-r2));stroke-width:1.05;}  /* 1급 국도 */
  .bm-r3{stroke:rgb(var(--map-road)/var(--map-a-r3));stroke-width:.75;}   /* 2·3급 도로 */
  .bm-r4{stroke:rgb(var(--map-road)/var(--map-a-r4));stroke-width:.55;}   /* 시가지 도로 */
  .bm-r5{stroke:rgb(var(--map-road)/var(--map-a-r5));stroke-width:.4;stroke-dasharray:1.8 1.8;}
  .bm-bord{stroke:rgb(var(--map-bord)/var(--map-a-bord));stroke-width:1;stroke-dasharray:5 3;}

  /* ── 넓은 화면 ────────────────────────────────────────── */
  /* DOM 순서는 폰과 같고 grid 배치만 바꿉니다. @media screen 이라 인쇄는 한 칸 그대로입니다.
     지도가 여러 줄에 걸쳐 놓일 때 마지막 1fr 줄이 지도 키를 받아 줘서 왼쪽 칸 사이가 벌어지지 않습니다 */
  @media screen and (min-width:1024px){
    .wrap{max-width:1160px;padding-left:40px;padding-right:40px;}
    .standfirst{max-width:76ch;}

    /* 개요: 섹션은 왼쪽에 쌓이고 개요 지도는 오른쪽에서 따라 내려옵니다. --hrows 는 build.py 가 셉니다 */
    .hgrid:has(>.hs-map){display:grid;column-gap:32px;align-items:start;
      grid-template-columns:minmax(0,1fr) minmax(0,440px);
      grid-template-rows:repeat(var(--hrows,1),auto) 1fr;}
    .hgrid:has(>.hs-map)>*{grid-column:1;}
    .hgrid:has(>.hs-map)>.hs-map{grid-column:2;grid-row:1 / -1;position:sticky;top:24px;}
    .hs-map>.section-label:first-child{margin-top:0;}

    /* 하루 카드: 글 | 지도. 지도가 없는 날은 한 칸 그대로입니다 */
    .day-body:has(>.daymap){display:grid;column-gap:28px;align-items:start;
      grid-template-columns:minmax(0,1fr) minmax(0,380px);grid-template-rows:auto 1fr;}
    .day-body:has(>.daymap)>*{grid-column:1;}
    .day-body:has(>.daymap)>.daymap{grid-column:2;grid-row:1 / -1;margin:4px 0 0;}

    /* 예상경비: 무엇에 쓰나 | 어디에 쓰나 */
    .cpair{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
      column-gap:20px;align-items:start;}

    .note{grid-template-columns:160px minmax(0,1fr);}
  }

  /* ── 좁은 화면(1024px 미만) — 날짜를 카드 위 한 줄로 올리고 카드를 꽉 채웁니다 ── */
  /* 날짜 칸 + 세로선 타임라인은 넓은 화면에서만 씁니다. 나라 색 점(.node)은 날짜 앞에 남깁니다 */
  @media (max-width:1023.98px){
    .day{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"rail date" "body body";
      align-items:center;column-gap:8px;}
    .day-rail{grid-area:rail;}
    .day-rail::before{display:none;}
    .node{position:static;display:block;width:10px;height:10px;box-shadow:none;}
    .day-date{grid-area:date;padding:0;text-align:left;font-size:13px;line-height:1.4;}
    .day-date em{display:inline;margin-left:6px;font-family:var(--font-sans);font-size:12px;}
    .day-body{grid-area:body;margin:8px 0 20px;}
    .border{display:block;margin:0 0 14px;}
    .border>.day-date,.border-rail{display:none;}
  }

  /* ── 모바일 ───────────────────────────────────────────── */
  @media (max-width:600px){
    .wrap{padding:36px 16px 72px;}
    .day-body{padding:16px 16px 18px;border-radius:20px;}
    .summary{padding:18px 18px 16px;}
    .sched li{grid-template-columns:46px minmax(0,1fr);gap:10px;}
    .note{grid-template-columns:minmax(0,1fr);gap:4px;padding:13px 18px;}
    .bar-row{grid-template-columns:74px minmax(0,1fr) 26px;}
    .flight{grid-template-columns:62px minmax(0,1fr);gap:12px;padding:12px 18px;}
    /* 일자별 표: 좁으면 날짜·내용 한 줄, 금액 아래 줄 */
    .ctr{grid-template-columns:58px minmax(0,1fr);gap:4px 10px;padding:11px 18px;}
    .ctr .cnum{grid-column:2;text-align:left;}
    .ctr .cacc::before{content:"누계 ";color:var(--muted);}
    .ctr .cnum::before{content:"하루 ";color:var(--muted);}
    .chead span:nth-child(3),.chead span:nth-child(4){display:none;}
    .cfoot span:nth-child(4){display:none;}
    .cfoot span:nth-child(3){text-align:left;}
    .ctr.d3{grid-template-columns:52px minmax(0,1fr);}
    .ctr.d3 .cnum{grid-column:2;text-align:left;}
    .ctr.d3 .cnum::before{content:none;}
    .ctr.d3 .cnum small{display:inline;margin-left:6px;}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .kpi{padding:14px 16px;} .kpi-v{font-size:17px;}
    .tl{grid-template-columns:62px minmax(0,1fr);gap:10px;padding:9px 18px;}
    .mvcard{padding:14px 18px;gap:10px;}
    .mvcard b{font-size:14px;}
    .mvr{grid-template-columns:56px minmax(0,1fr);gap:4px 10px;padding:11px 18px;}
    .mvr .mva{grid-column:2;text-align:left;}
  }

  /* ── 인쇄 ─────────────────────────────────────────────── */
  @media print{
    /* 다크(명시·시스템) 어느 상태에서 인쇄해도 이기도록 특이도를 올립니다 */
    :root:root:root{
      --background:var(--white);--foreground:var(--eclipse);
      --surface:var(--white);--surface-secondary:oklch(.97 .001 286);
      --muted:oklch(.45 .01 286);--default:oklch(.95 .001 286);
      --default-foreground:var(--eclipse);
      --border:oklch(.84 .004 286);--separator:oklch(.88 .004 286);
      /* 그림자 대신 가는 테두리로 카드 경계를 남깁니다 */
      --surface-shadow:0 0 0 1px oklch(.86 .004 286);--overlay-shadow:none;
      color-scheme:light;
    }
    body{background:#fff;font-size:11pt;}
    .wrap{padding:0;max-width:100%;}
    .day,.note,.flight,.daymap,.summary,.border,.ccard{break-inside:avoid;}
    /* 탭 CSS 는 @media screen 안에만 있으므로 인쇄하면 모든 나라가 그대로 나옵니다 */
    .tabs,.ccards,.vsw,.mvchev{display:none!important;}
    .mvitem{break-inside:avoid;}
    .rgn-head{break-after:avoid;}
    .mapctl{display:none;}
    .gmap{border-bottom:none;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
