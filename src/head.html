<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════════
     shadcn/ui 디자인 토큰 — React·Tailwind 없이 순수 CSS로 옮긴 것.
     이름과 값은 shadcn 기본 테마(neutral)를 그대로 따릅니다.
     ══════════════════════════════════════════════════════════════ */
  :root{
    --background:0 0% 100%;
    --foreground:240 10% 3.9%;
    --card:0 0% 100%;
    --card-foreground:240 10% 3.9%;
    --primary:240 5.9% 10%;
    --primary-foreground:0 0% 98%;
    --secondary:240 4.8% 95.9%;
    --secondary-foreground:240 5.9% 10%;
    --muted:240 4.8% 95.9%;
    --muted-foreground:240 3.8% 46.1%;
    --accent:240 4.8% 95.9%;
    --accent-foreground:240 5.9% 10%;
    --destructive:0 72.2% 50.6%;
    --destructive-foreground:0 0% 98%;
    --border:240 5.9% 90%;
    --ring:240 5% 64.9%;
    --radius:0.625rem;
    /* 한글이 섞여도 깨지지 않게: 라틴·숫자는 모노, 한글은 본문 글꼴로 떨어집니다 */
    --font-sans:Inter,"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,
      "Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --font-mono:"JetBrains Mono","IBM Plex Sans KR",ui-monospace,SFMono-Regular,
      Menlo,"Malgun Gothic",monospace;
    --good:142 72% 29%;
    --map-water:31 111 165;
    --map-road:94 80 68;
    --map-bord:36 30 34;
    --map-a-sea:.13; --map-a-water:.17; --map-a-riv:.34; --map-a-coast:.45;
    --map-a-r1:.34; --map-a-r2:.26; --map-a-r3:.21; --map-a-r4:.17; --map-a-r5:.15;
    --map-a-bord:.38;
    --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .05);
    --shadow:0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
    color-scheme:light dark;
  }
  /* OS 가 다크이고, 사용자가 라이트를 명시하지 않았을 때 */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --background:240 10% 3.9%;
      --foreground:0 0% 98%;
      --card:240 10% 5.9%;
      --card-foreground:0 0% 98%;
      --primary:0 0% 98%;
      --primary-foreground:240 5.9% 10%;
      --secondary:240 3.7% 15.9%;
      --secondary-foreground:0 0% 98%;
      --muted:240 3.7% 15.9%;
      --muted-foreground:240 5% 64.9%;
      --accent:240 3.7% 15.9%;
      --accent-foreground:0 0% 98%;
      --destructive:0 62.8% 50%;
      --destructive-foreground:0 0% 98%;
      --border:240 3.7% 18%;
      --ring:240 4.9% 40%;
      --good:141 76% 58%;
      --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .4);
      --shadow:0 1px 3px 0 rgb(0 0 0 / .5), 0 1px 2px -1px rgb(0 0 0 / .5);
      --map-water:126 193 232;
      --map-road:226 216 206;
      --map-bord:239 233 228;
      --map-a-sea:.11; --map-a-water:.13; --map-a-riv:.30; --map-a-coast:.34;
      --map-a-r1:.28; --map-a-r2:.21; --map-a-r3:.16; --map-a-r4:.13; --map-a-r5:.11;
      --map-a-bord:.34;
    }
  }
  /* 사용자가 다크를 명시했을 때 — OS 설정을 이깁니다 */
  :root[data-theme="dark"]{
      --background:240 10% 3.9%;
      --foreground:0 0% 98%;
      --card:240 10% 5.9%;
      --card-foreground:0 0% 98%;
      --primary:0 0% 98%;
      --primary-foreground:240 5.9% 10%;
      --secondary:240 3.7% 15.9%;
      --secondary-foreground:0 0% 98%;
      --muted:240 3.7% 15.9%;
      --muted-foreground:240 5% 64.9%;
      --accent:240 3.7% 15.9%;
      --accent-foreground:0 0% 98%;
      --destructive:0 62.8% 50%;
      --destructive-foreground:0 0% 98%;
      --border:240 3.7% 18%;
      --ring:240 4.9% 40%;
      --good:141 76% 58%;
      --shadow-sm:0 1px 2px 0 rgb(0 0 0 / .4);
      --shadow:0 1px 3px 0 rgb(0 0 0 / .5), 0 1px 2px -1px rgb(0 0 0 / .5);
      --map-water:126 193 232;
      --map-road:226 216 206;
      --map-bord:239 233 228;
      --map-a-sea:.11; --map-a-water:.13; --map-a-riv:.30; --map-a-coast:.34;
      --map-a-r1:.28; --map-a-r2:.21; --map-a-r3:.16; --map-a-r4:.13; --map-a-r5:.11;
      --map-a-bord:.34;
  }
  /* 반지름 단계 — shadcn 의 rounded-lg / -md / -sm */
  :root{
    --radius-lg:var(--radius);
    --radius-md:calc(var(--radius) - 2px);
    --radius-sm:calc(var(--radius) - 4px);
  }

  *{box-sizing:border-box;border-color:hsl(var(--border));}
  html{-webkit-text-size-adjust:100%;background:hsl(var(--background));}
  body{
    margin:0;background:hsl(var(--background));color:hsl(var(--foreground));
    font-family:var(--font-sans);
    font-weight:400;font-size:14px;line-height:1.6;
    -webkit-font-smoothing:antialiased;font-feature-settings:"cv02","cv03","cv04","cv11";
  }
  .wrap{max-width:820px;margin:0 auto;padding:56px 24px 96px;min-height:100vh;}
  ::selection{background:hsl(var(--foreground));color:hsl(var(--background));}

  /* ── 머리말 ───────────────────────────────────────────── */
  .eyebrow{font-size:12px;font-weight:500;letter-spacing:.06em;
    color:hsl(var(--muted-foreground));margin:0 0 14px;}
  .title{font-size:clamp(30px,5.4vw,44px);line-height:1.15;margin:0 0 10px;
    font-weight:700;letter-spacing:-.028em;color:hsl(var(--foreground));}
  .title .sep{color:hsl(var(--muted-foreground));padding:0 .12em;font-weight:400;}
  .subtitle{font-size:14px;color:hsl(var(--muted-foreground));margin:0 0 14px;letter-spacing:-.005em;}
  .standfirst{font-size:15px;line-height:1.7;color:hsl(var(--muted-foreground));
    margin:0 0 36px;max-width:64ch;}

  /* ── Card — 숙박 배분 ─────────────────────────────────── */
  .summary{background:hsl(var(--card));color:hsl(var(--card-foreground));
    border:1px solid hsl(var(--border));border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);padding:22px 24px 20px;margin-bottom:8px;}
  .sum-head{display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .sum-head h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em;
    color:hsl(var(--card-foreground));}
  .sum-total{font-family:var(--font-mono);font-size:12px;
    color:hsl(var(--muted-foreground));}
  /* Progress */
  .bar-row{display:grid;grid-template-columns:88px 1fr 30px;align-items:center;
    gap:12px;margin-bottom:8px;}
  .bar-name{font-size:13px;color:hsl(var(--muted-foreground));}
  .bar-track{height:8px;background:hsl(var(--secondary));border-radius:9999px;overflow:hidden;}
  .bar-fill{height:100%;display:block;border-radius:9999px;
    background:hsl(var(--primary));}
  .bar-fill.air{background:repeating-linear-gradient(90deg,
    hsl(var(--muted-foreground)) 0 3px,transparent 3px 7px);}
  .bar-num{font-family:var(--font-mono);font-size:12px;
    color:hsl(var(--muted-foreground));text-align:right;font-variant-numeric:tabular-nums;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;
    color:hsl(var(--muted-foreground));margin-top:16px;padding-top:14px;
    border-top:1px solid hsl(var(--border));}
  .legend span{display:flex;align-items:center;gap:6px;}
  .swatch{width:9px;height:9px;display:inline-block;border-radius:3px;}
  .swatch.air{background:hsl(var(--muted-foreground));}

  /* 나라·지역별 색 — colors 에서 자동 생성됩니다 */
__COLORCSS__

  /* ── Tabs — 나라별 보기 (라디오 + :checked, 자바스크립트 없음) ── */
__VIEWCSS__
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:26px 0 30px;padding:4px;
    background:hsl(var(--muted));border-radius:var(--radius-lg);}
  .tab{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;
    border-radius:var(--radius-md);font-size:13px;font-weight:500;
    color:hsl(var(--muted-foreground));cursor:pointer;
    -webkit-user-select:none;user-select:none;white-space:nowrap;
    transition:background-color .15s,color .15s;}
  .tab:hover{color:hsl(var(--foreground));}
  .tab .swatch{width:8px;height:8px;border-radius:9999px;flex:none;}
  .vsw:focus-visible+.tabs .tab,.vsw:focus-visible~.tabs .tab[for]{outline:none;}

  /* 나라 카드 — 홈에서 눌러 들어갑니다 */
  .ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
  .ccard{display:flex;flex-direction:column;gap:2px;padding:16px 18px;cursor:pointer;
    background:hsl(var(--card));color:hsl(var(--card-foreground));
    border:1px solid hsl(var(--border));border-left-width:3px;
    border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
    transition:box-shadow .15s,transform .15s;}
  .ccard:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .cc-name{font-size:15px;font-weight:600;letter-spacing:-.015em;}
  .cc-span,.cc-num{font-family:var(--font-mono);font-size:11.5px;
    color:hsl(var(--muted-foreground));}
  .cc-city{font-size:12px;color:hsl(var(--muted-foreground));margin-top:6px;line-height:1.5;}

  /* ── 하루씩 훑어보기 — 개요에서 16일을 한 화면에 ─────── */
  .tline{border:1px solid hsl(var(--border));border-radius:var(--radius-lg);
    overflow:hidden;box-shadow:var(--shadow-sm);background:hsl(var(--card));}
  .tl{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:baseline;
    padding:9px 16px;border-top:1px solid hsl(var(--border));cursor:pointer;
    transition:background-color .12s;}
  .tl:first-child{border-top:0;}
  .tl:hover{background:hsl(var(--muted));}
  .tl-d{font-family:var(--font-mono);font-size:12px;font-weight:500;
    color:hsl(var(--foreground));border-left:3px solid transparent;
    padding-left:9px;margin-left:-9px;}
  .tl-d em{font-style:normal;color:hsl(var(--muted-foreground));margin-left:4px;}
  .tl-p{font-size:13.5px;color:hsl(var(--card-foreground));line-height:1.5;}

  /* ── 예상경비 ─────────────────────────────────────────── */
  .bar-name small{display:block;font-size:11px;font-weight:400;
    color:hsl(var(--muted-foreground));margin-top:1px;}
  .bar-row{align-items:center;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;
    margin-bottom:8px;}
  .kpi{display:flex;flex-direction:column;gap:3px;padding:16px 18px;
    background:hsl(var(--card));border:1px solid hsl(var(--border));
    border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
  .kpi-l{font-size:12.5px;color:hsl(var(--muted-foreground));}
  .kpi-v{font-family:var(--font-mono);font-size:19px;font-weight:500;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:hsl(var(--card-foreground));}
  .kpi-s{font-size:11.5px;color:hsl(var(--muted-foreground));min-height:1em;}
  .kpi.good .kpi-v{color:hsl(var(--good));}
  .kpi.bad .kpi-v{color:hsl(var(--destructive));}

  /* 일자별 표 */
  .ctab{border:1px solid hsl(var(--border));border-radius:var(--radius-lg);
    overflow:hidden;box-shadow:var(--shadow-sm);background:hsl(var(--card));}
  .ctr{display:grid;grid-template-columns:64px 1fr 92px 92px;gap:12px;
    padding:11px 16px;border-top:1px solid hsl(var(--border));align-items:baseline;}
  .ctr:first-child{border-top:0;}
  .chead,.cfoot{background:hsl(var(--muted));font-size:12px;font-weight:600;
    color:hsl(var(--muted-foreground));}
  .chead span:nth-child(3),.chead span:nth-child(4),
  .cfoot span:nth-child(3),.cfoot span:nth-child(4){text-align:right;}
  .cfoot{border-top:1px solid hsl(var(--border));color:hsl(var(--foreground));}
  .cdate{font-family:var(--font-mono);font-size:12px;font-weight:500;
    color:hsl(var(--foreground));border-left:3px solid transparent;padding-left:8px;
    margin-left:-8px;}
  .cdate em{font-style:normal;color:hsl(var(--muted-foreground));margin-left:4px;}
  .cdesc{font-size:13px;color:hsl(var(--card-foreground));line-height:1.5;}
  .cdesc small{display:block;font-size:11.5px;color:hsl(var(--muted-foreground));
    margin-top:2px;line-height:1.55;}
  .cnum{font-family:var(--font-mono);font-size:12.5px;text-align:right;
    font-variant-numeric:tabular-nums;color:hsl(var(--card-foreground));}
  .cnum small{display:block;font-size:11px;color:hsl(var(--muted-foreground));margin-top:2px;}
  .cacc{color:hsl(var(--muted-foreground));}
  .ctr.d3{grid-template-columns:56px 1fr 104px;}   /* 구간별 교통비·입장료 */
  .cfree{font-family:var(--font-sans);font-size:11.5px;color:hsl(var(--muted-foreground));}

  /* 환율 */
  .rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;}
  .rate{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    padding:11px 14px;background:hsl(var(--muted));border-radius:var(--radius-md);}
  .rate b{font-family:var(--font-mono);font-size:12.5px;font-weight:500;
    color:hsl(var(--foreground));}
  .rate span{font-family:var(--font-mono);font-size:12.5px;
    color:hsl(var(--muted-foreground));font-variant-numeric:tabular-nums;}

  /* 나라가 바뀌는 자리의 머리글 */
  .rgn-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
    margin:40px 0 16px;padding-bottom:11px;border-bottom:1px solid hsl(var(--border));}
  .rgn-head:first-of-type{margin-top:8px;}
  .rgn-head .swatch{width:9px;height:9px;border-radius:9999px;align-self:center;}
  .rgn-head b{font-size:17px;font-weight:600;letter-spacing:-.022em;color:hsl(var(--foreground));}
  .rgn-head span{font-family:var(--font-mono);font-size:12px;
    color:hsl(var(--muted-foreground));}

  /* ── 구획 제목 ────────────────────────────────────────── */
  /* 한글 제목이라 모노·대문자·자간을 걷어냈습니다 — 그러면 글꼴이 섞여 이상해집니다 */
  .section-label{font-size:13px;font-weight:600;letter-spacing:-.01em;
    color:hsl(var(--muted-foreground));margin:44px 0 14px;}

  /* ── 항공편 — Card 안의 표 ────────────────────────────── */
  .flight{display:grid;grid-template-columns:78px 1fr;gap:16px;padding:13px 18px;
    background:hsl(var(--card));border:1px solid hsl(var(--border));
    border-bottom-width:0;font-size:14px;}
  .flight:first-of-type{border-top-left-radius:var(--radius-lg);border-top-right-radius:var(--radius-lg);}
  .flight:last-of-type{border-bottom-width:1px;box-shadow:var(--shadow-sm);
    border-bottom-left-radius:var(--radius-lg);border-bottom-right-radius:var(--radius-lg);}
  .flight-date{font-family:var(--font-mono);font-size:12px;
    color:hsl(var(--muted-foreground));padding-top:2px;}
  .flight-body{color:hsl(var(--muted-foreground));}
  .flight-body b{font-weight:600;color:hsl(var(--card-foreground));}

  /* ── 날짜 블록 ────────────────────────────────────────── */
  .day{display:grid;grid-template-columns:74px 26px 1fr;}
  .day-date{font-family:var(--font-mono);font-size:12.5px;
    font-weight:500;color:hsl(var(--foreground));padding:26px 12px 0 0;text-align:right;line-height:1.4;}
  .day-date em{display:block;font-style:normal;font-size:11px;font-weight:400;
    color:hsl(var(--muted-foreground));}
  .day-rail{position:relative;}
  .day-rail::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;
    background:hsl(var(--border));}
  .day:first-of-type .day-rail::before{top:30px;}
  .day.last .day-rail::before{bottom:auto;height:32px;}
  .node{position:absolute;left:5px;top:26px;width:12px;height:12px;
    background:hsl(var(--background));border:2px solid hsl(var(--border));
    border-radius:9999px;z-index:2;box-shadow:0 0 0 3px hsl(var(--background));}
  .day.stay .node{background:hsl(var(--primary));}

  /* 하루 = Card */
  .day-body{margin:14px 0 18px;padding:20px 22px 22px;
    background:hsl(var(--card));color:hsl(var(--card-foreground));
    border:1px solid hsl(var(--border));border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);}
  .day-place{font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:-.018em;
    color:hsl(var(--card-foreground));}
  .day-sub{font-size:13.5px;color:hsl(var(--muted-foreground));margin:0 0 16px;line-height:1.65;}

  /* ── 시간표 ───────────────────────────────────────────── */
  .sched{list-style:none;margin:0;padding:0;}
  .sched li{display:grid;grid-template-columns:52px 1fr;gap:12px;
    padding:7px 0;font-size:13.5px;border-top:1px solid hsl(var(--border));}
  .sched li:first-child{border-top:0;}
  .sched .t{font-family:var(--font-mono);font-size:12px;
    font-variant-numeric:tabular-nums;color:hsl(var(--muted-foreground));padding-top:2px;}
  .sched .a{color:hsl(var(--card-foreground));line-height:1.6;}
  .sched .a small{display:block;font-size:12.5px;color:hsl(var(--muted-foreground));
    line-height:1.6;margin-top:3px;}

  /* ── Badge ────────────────────────────────────────────── */
  .bus{display:inline-flex;align-items:center;border-radius:var(--radius-sm);
    border:1px solid transparent;background:hsl(var(--secondary));
    color:hsl(var(--secondary-foreground));font-size:11px;font-weight:500;
    padding:1px 7px;margin-right:6px;white-space:nowrap;vertical-align:1px;}
  .tag{display:inline-flex;align-items:center;border-radius:9999px;
    border:1px solid hsl(var(--border));background:transparent;
    color:hsl(var(--muted-foreground));font-size:11px;font-weight:500;
    letter-spacing:0;padding:1px 9px;margin-left:8px;white-space:nowrap;vertical-align:1px;}
  .tag.hot{border-color:transparent;background:hsl(var(--destructive));
    color:hsl(var(--destructive-foreground));font-weight:600;}

  /* ── Alert — 주의 박스 ────────────────────────────────── */
  .flag{margin-top:14px;padding:13px 16px;
    border:1px solid hsl(var(--border));border-radius:var(--radius-md);
    background:hsl(var(--muted));font-size:13px;line-height:1.65;
    color:hsl(var(--muted-foreground));}
  .flag b{font-weight:600;color:hsl(var(--foreground));}
  .flag+.flag{margin-top:8px;}

  /* ── 국경·이동 구분선 ─────────────────────────────────── */
  .border{display:grid;grid-template-columns:74px 26px 1fr;margin:2px 0;}
  .border-rail{position:relative;}
  .border-rail::before{content:"";position:absolute;left:4px;top:50%;width:14px;height:2px;
    background:hsl(var(--border));}
  .border-body{margin:6px 0;padding:14px 18px;border:1px dashed hsl(var(--border));
    border-radius:var(--radius-md);background:hsl(var(--muted));}
  .border-title{font-size:13px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;
    color:hsl(var(--foreground));}
  .border-note{font-size:12.5px;color:hsl(var(--muted-foreground));margin:0;line-height:1.65;}

  /* ── 확인사항 — Table 느낌 ────────────────────────────── */
  .notes{margin-top:56px;}
  .notes h2{font-size:20px;font-weight:600;margin:0 0 18px;letter-spacing:-.02em;
    color:hsl(var(--foreground));}
  .note{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:14px 18px;
    background:hsl(var(--card));border:1px solid hsl(var(--border));border-bottom-width:0;}
  .note:first-of-type{border-top-left-radius:var(--radius-lg);border-top-right-radius:var(--radius-lg);}
  .note:last-of-type{border-bottom-width:1px;box-shadow:var(--shadow-sm);
    border-bottom-left-radius:var(--radius-lg);border-bottom-right-radius:var(--radius-lg);}
  .note-key{font-size:12.5px;font-weight:600;color:hsl(var(--card-foreground));padding-top:1px;}
  .note-val{font-size:13px;color:hsl(var(--muted-foreground));line-height:1.7;}
  .note-val b{font-weight:600;color:hsl(var(--card-foreground));}
  .foot{margin-top:40px;padding-top:18px;border-top:1px solid hsl(var(--border));
    font-size:12px;color:hsl(var(--muted-foreground));}

  .opt-label{font-size:12.5px;font-weight:600;color:hsl(var(--muted-foreground));
    margin:16px 0 6px;padding-top:12px;border-top:1px solid hsl(var(--border));}

  /* ── 일자별 경로 지도 (인라인 SVG · 오프라인) ─────────── */
  .daymap{margin:18px 0 2px;}
  .mapsvg{display:block;width:100%;height:auto;border:1px solid hsl(var(--border));
    border-radius:var(--radius-md);background:hsl(var(--muted));}
  .mapbg{fill:transparent;}
  .maplbl{font-family:var(--font-sans);paint-order:stroke;
    stroke:hsl(var(--card));stroke-width:2.8px;stroke-linejoin:round;}
  .maplbl.town{font-size:8.5px;fill:hsl(var(--muted-foreground));}
  .maplbl.stop{font-size:10px;font-weight:600;fill:hsl(var(--foreground));}
  .maplbl.lake{font-size:9px;fill:rgb(var(--map-water));opacity:.8;text-anchor:middle;}
  .maptown{fill:hsl(var(--muted-foreground));opacity:.55;}
  .mapn{font-family:var(--font-mono);font-size:10.5px;
    font-weight:600;fill:#fff;text-anchor:middle;}
  .mapsm{font-family:var(--font-mono);font-size:9.5px;
    fill:hsl(var(--muted-foreground));}
  .mapscale{stroke:hsl(var(--muted-foreground));stroke-width:1;}
  .mapseq{font-size:12.5px;line-height:1.8;color:hsl(var(--muted-foreground));margin:10px 0 0;}
  .mapseq b{font-family:var(--font-mono);font-size:10.5px;
    color:hsl(var(--foreground));font-weight:600;margin-right:2px;}
  .mapdot{color:hsl(var(--border));margin:0 3px;}
  .mapcap{font-size:12px;color:hsl(var(--muted-foreground));margin:8px 0 0;line-height:1.65;}
  .mapctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 0;}
  /* Button — outline / ghost */
  .maptog{display:inline-flex;align-items:center;justify-content:center;height:32px;
    padding:0 12px;font-family:inherit;font-size:12.5px;font-weight:500;
    color:hsl(var(--foreground));background:hsl(var(--background));
    border:1px solid hsl(var(--border));border-radius:var(--radius-md);cursor:pointer;
    transition:background-color .15s,border-color .15s,box-shadow .15s;}
  .maptog:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground));}
  .maptog:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring));}
  .maptog[disabled]{opacity:.5;cursor:default;background:hsl(var(--background));}
  .maplink{display:inline-flex;align-items:center;height:32px;padding:0 10px;
    font-size:12.5px;font-weight:500;color:hsl(var(--muted-foreground));
    text-decoration:none;border-radius:var(--radius-md);
    transition:background-color .15s,color .15s;}
  .maplink:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground));}
  .leafbox{height:320px;border:1px solid hsl(var(--border));border-radius:var(--radius-md);}
  .mapnum{display:flex;align-items:center;justify-content:center;width:22px;height:22px;
    border-radius:50%;color:#fff;font-family:var(--font-mono);
    font-size:10.5px;font-weight:600;background:#42606E;
    /* 흰 테두리만 두면 밝은 타일 위에서 사라져서, 바깥에 옅은 검은 테두리를 한 겹 더 둡니다 */
    box-shadow:0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.35);}
  /* 관광지 이름 → 구글 지도 (점선 밑줄이 링크 표시입니다) */
  .gmap{color:inherit;text-decoration:none;
    border-bottom:1px dashed hsl(var(--muted-foreground));
    text-underline-offset:3px;transition:color .15s,border-color .15s;}
  .gmap:hover,.gmap:focus{color:hsl(var(--foreground));border-bottom-color:hsl(var(--foreground));}
  .leaflet-container{font:inherit;border-radius:var(--radius-md);}
  .leaflet-control-attribution{font-size:9px !important;}

  /* ── 오프라인 벡터 배경지도 · Natural Earth 10m + OSM ─── */
  .bm{pointer-events:none;}
  .bm>path{stroke-linecap:round;stroke-linejoin:round;}
  .bm-sea,.bm-water{stroke:none;}
  .bm-riv,.bm-coast,.bm-r1,.bm-r2,.bm-r3,.bm-r4,.bm-r5,.bm-bord{fill:none;}
  .bm-sea{fill:rgb(var(--map-water)/var(--map-a-sea));}
  .bm-water{fill:rgb(var(--map-water)/var(--map-a-water));}
  .bm-riv{stroke:rgb(var(--map-water)/var(--map-a-riv));stroke-width:.8;}
  .bm-coast{stroke:rgb(var(--map-water)/var(--map-a-coast));stroke-width:.7;}
  .bm-r1{stroke:rgb(var(--map-road)/var(--map-a-r1));stroke-width:1.5;}   /* 고속·간선 */
  .bm-r2{stroke:rgb(var(--map-road)/var(--map-a-r2));stroke-width:1.05;}  /* 1급 국도 */
  .bm-r3{stroke:rgb(var(--map-road)/var(--map-a-r3));stroke-width:.75;}   /* 2·3급 도로 */
  .bm-r4{stroke:rgb(var(--map-road)/var(--map-a-r4));stroke-width:.55;}   /* 시가지 도로 */
  .bm-r5{stroke:rgb(var(--map-road)/var(--map-a-r5));stroke-width:.4;stroke-dasharray:1.8 1.8;}
  .bm-bord{stroke:rgb(var(--map-bord)/var(--map-a-bord));stroke-width:1;stroke-dasharray:5 3;}

  /* ── 모바일 ───────────────────────────────────────────── */
  @media (max-width:600px){
    .wrap{padding:36px 16px 72px;}
    .day,.border{grid-template-columns:52px 22px 1fr;}
    .day-date{font-size:11.5px;padding-right:8px;}
    .node{left:3px;} .day-rail::before{left:8px;}
    .day-body{padding:16px 15px 18px;}
    .summary{padding:18px 16px 16px;}
    .sched li{grid-template-columns:46px 1fr;gap:10px;}
    .note{grid-template-columns:1fr;gap:4px;padding:13px 15px;}
    .bar-row{grid-template-columns:74px 1fr 26px;}
    .flight{grid-template-columns:62px 1fr;gap:12px;padding:12px 15px;}
    /* 일자별 표: 좁으면 날짜·내용 한 줄, 금액 아래 줄 */
    .ctr{grid-template-columns:58px 1fr;gap:4px 10px;padding:11px 14px;}
    .ctr .cnum{grid-column:2;text-align:left;}
    .ctr .cacc::before{content:"누계 ";color:hsl(var(--muted-foreground));}
    .ctr .cnum::before{content:"하루 ";color:hsl(var(--muted-foreground));}
    .chead span:nth-child(3),.chead span:nth-child(4){display:none;}
    .cfoot span:nth-child(4){display:none;}
    .cfoot span:nth-child(3){text-align:left;}
    .ctr.d3{grid-template-columns:52px 1fr;}
    .ctr.d3 .cnum{grid-column:2;text-align:left;}
    .ctr.d3 .cnum::before{content:none;}
    .ctr.d3 .cnum small{display:inline;margin-left:6px;}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
    .kpi{padding:14px 15px;} .kpi-v{font-size:17px;}
    .tl{grid-template-columns:62px 1fr;gap:10px;padding:9px 14px;}
  }

  /* ── 인쇄 ─────────────────────────────────────────────── */
  @media print{
    :root{
      --background:0 0% 100%;--foreground:240 10% 10%;
      --card:0 0% 100%;--card-foreground:240 10% 10%;
      --muted:240 5% 97%;--muted-foreground:240 4% 40%;
      --secondary:240 5% 94%;--border:240 6% 82%;
      --shadow-sm:none;--shadow:none;
    }
    body{background:#fff;font-size:11pt;}
    .wrap{padding:0;max-width:100%;}
    .day,.note,.flight,.daymap,.summary,.border,.ccard{break-inside:avoid;}
    /* 탭 CSS 는 @media screen 안에만 있으므로 인쇄하면 모든 나라가 그대로 나옵니다 */
    .tabs,.ccards,.vsw{display:none;}
    .rgn-head{break-after:avoid;}
    .mapctl{display:none;}
    .gmap{border-bottom:none;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
