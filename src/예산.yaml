budget_notes:
- 야간버스 2회로 숙박 2박이 빠졌습니다(9/22·9/26 숙박비 0원). 그 대신 스바네티 트레킹 3박(자베시·아디시·이프랄리)이 들어갔습니다.
- 트레킹 3박은 게스트하우스 저녁·아침 포함 85라리(45,985원) 기준입니다(2026년 1월 자료). 그래서 9/24·9/25 식비는 도시락·간식값 15,000원만 잡았습니다.
- 카즈베기 1박 · 예레반 3박 구성입니다. 카즈베기 산악 택시가 줄어든 만큼 예레반 숙박 1박(20,000원)이 늘어 거의 상쇄됩니다.
- 가는 야간버스가 결항해 직행 마르슈르트카로 대체하면 트빌리시 숙소 1박(15,689원)이 늘고 교통비는 25라리 줄어듭니다.
- ※ 여행자보험·유심·기념품은 별도로 잡으세요. 스바네티 소금과 조지아 와인이 주요 지출처입니다.
- ※ 아르메니아 나흘을 다시 짜면서 교통·입장료가 20,800드람(약 80,704원) 늘었습니다 — 9/29 택시 · 9/30 에치미아진·즈바르트노츠 · 10/2 호르 비랍. 아흐탈라 수도원과 아라라트 브랜디 공장은 예비비 때문에 넣지 않았습니다.
