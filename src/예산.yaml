  교통상세: ‘대중교통’ 열이 ○ 이면 마르슈르트카·버스·지하철로 갈 수 있는 구간, △ 는 부분적, ✕ 는 택시가 사실상 필수인 구간입니다. 택시 요금은 환율 시트의 인원(현재 1명)으로 나눈 1인 부담액입니다.
