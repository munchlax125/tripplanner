  일정: 일정 YAML 에서 그대로 생성한 시트입니다. HTML 문서와 같은 소스라 숫자·시각이 갈라지지 않습니다. 「이동」이 비어 있으면 걸어서 가는 구간이고, 「주의」 행은 그 날이 무너질 수 있는 지점입니다. 4행에 필터가 걸려 있으니 날짜나 이동수단으로 걸러 보세요.
