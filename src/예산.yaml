- 가는 야간버스가 중단돼 있으면 트빌리시 1박을 더하고 디두베→메스티아 직행 마르슈르트카(50라리, 9시간)로 대체합니다 — 교통비는 25라리 줄고 숙박비 15,689원이 늘어 거의 같습니다. 오는 편이 안 뜨면 주그디디 1박이 붙고 카즈베기 도착이 9/27 저녁으로 밀립니다.
- 9/23 은 B안(마르슈르트카 40 + 자베시 택시 50라리) 기준입니다. A안(새벽 합승택시 1인 70~75라리, 걸어서 자베시)이면 조금 줄지만 동행을 찾아야 합니다.
- 9/26 오후 메스티아→주그디디 편이 없으면 택시(차 한 대 약 300라리, 약 16만원)가 필요합니다 — 예비비를 넘으니 9/23 에 메스티아에서 미리 확인하세요.
- 카즈베기는 1박이라 게르게티 4WD 외에 산악 택시가 들지 않습니다. 거기서 아낀 하루가 예레반 3박째가 됐습니다.
- 아르메니아 나흘에서 택시가 새로 붙은 곳은 두 군데입니다 — 9/29 알라베르디(버스 네 번 대신 택시 한 대, 6,000드람)와 10/2 호르 비랍(왕복 12,000드람). 에치미아진·즈바르트노츠(9/30)는 마르슈르트카로 가야 예비비가 남습니다.
