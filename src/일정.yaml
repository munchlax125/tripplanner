  - 주타 대신 <b>그벨레티 폭포</b>(다리알 협곡 방향 · 왕복 택시 50라리 + 도보 1시간)로 바꿔도 됩니다. 짧고 쉬워서 게르게티 재시도와 같은 날 묶기에는 이쪽이 편합니다.
