  map:
    id: m21
    cap: 메스티아에서 찰라디 빙하까지 <b>택시로 트레일헤드까지 이동한 뒤 걷는 구간</b>입니다. 오후 주그디디 이동(3~4시간)과 밤의 야간버스는 지도에서 뺐습니다.
  flags:
  - <b>메스티아→주그디디 오후 편이 이 날의 유일한 리스크입니다.</b> 공식 시간표는 아침 08:00 편 하나뿐이고, 오후 14·16시는 성수기에만 붙는 비공식 편입니다. 전날 밤 숙소에 부탁해 좌석을 확보하거나, 안 되면 셰어택시(주그디디까지 1인 40~50라리 선)로 바꾸세요. 이 편을 놓치면 그날 밤 야간버스도 같이 무너집니다.
  - <b>찰라디 빙하는 코룰디 호수보다 짧고 확실합니다.</b> 코룰디는 편도 4시간 이상 걸려 그날 안에 주그디디까지 내려가는 일정과 맞지 않습니다. 시간에 덜 쫓기고 싶다면 트레킹을 접고 메스티아 스바네티 탑 마을을 반나절 걷는 것으로 바꿔도 됩니다.
  - 9/24와 같은 이유로 이 날 밤 OmniBus 편도 사전 확인이 필요합니다. 막히면 저녁 마르슈르트카(주그디디→트빌리시, 낮 시간대 위주)로 갈아타고 트빌리시에서 1박 후 9/27 아침에 알라베르디로 출발하세요.
