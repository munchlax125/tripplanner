overview_cap: 트빌리시 IN → 므츠헤타 → 카즈베기 2박 → 시그나기 → 국경 → 알라베르디 → 딜리잔 → 세반 → 예레반 4박 → 남부 당일 왕복. 번호는 방문 순서이고 트빌리시는 세 번, 예레반은 두 번 거칩니다. <b>11~13번(코르 비랍 · 노라방크 · 타테브)은 9/30 하루에 투어로 한 번에 도는 구간</b>입니다. 가르니·게하르트(10/1)는 예레반에서 30km라 이 축척에서는 예레반과 겹쳐 뺐습니다 — 해당 날짜 지도를 보세요.
