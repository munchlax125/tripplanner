  - <b>케이블카는 올라갈 때만 타세요.</b> 내려올 때는 능선을 따라 조지아의 어머니 상 쪽으로 걸으면 구시가 지붕이 계속 보입니다. 30~40분 내리막이라 부담이 없습니다.
