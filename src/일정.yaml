title: 조지아<span class="sep">·</span>아르메니아
subtitle: 9월 19일 – 10월 5일 · 1인 · 상하이 경유 · 트빌리시 IN · 아테네·아부다비 경유 · 인천 도착
standfirst: 저가 항공 조합으로 예산을 맞춘 대신 이동이 많습니다. 가는 길에 상하이 1박이 붙어 반나절 시내 관광이 가능해졌고, 지상 구간은 대중교통 우선으로 짜되 최장 이동일은 이틀로 쪼갰습니다. 카즈베기를 1박으로 줄여 얻은 여유는 <b>스바네티(주그디디·메스티아)</b>에 통째로 넣었습니다 — 트빌리시·주그디디 사이는 <b>야간버스 왕복</b>으로 낮 시간을 아꼈고, 그만큼 카헤티(시그나기)는 이번엔 뺐습니다. 아르메니아는 국경을 넘어 <b>알라베르디에서 하루 묵은 뒤 곧장 예레반으로</b> 들어가 귬리를 거치지 않고 예레반을 닷새 붙박이로 만들었고, 남부 타테브만 <b>하루짜리 투어</b>로 다녀옵니다. 돌아오는 길은 예레반발 새벽 직항 → 아테네 1박 → 아부다비 1박입니다. 공항 노숙 구간은 없습니다.
nights_total: 상하이 1박 + 지상 11박 + 야간버스 2회 + 아테네·아부다비 각 1박 = 16일
