overview_cap: 트빌리시 IN → 카즈베기 → 국경 → 예레반 → 남부 타테브 → 예레반. 번호는 방문 순서이고, 같은 도시를 두 번 이상 거치는 구간이 있습니다. <b>주타(9/24)와 시그나기(9/25)</b>는 각각 스테판츠민다·트빌리시에서 왕복하는 당일치기라 별도 번호를 붙이지 않았습니다.
