title: 조지아<span class="sep">·</span>아르메니아
subtitle: 9월 19일 – 10월 5일 · 1인 · 상하이 경유 · 트빌리시 IN · 아테네·아부다비 경유 · 인천 도착
standfirst: 저가 항공 조합으로 예산을 맞춘 대신 이동이 많습니다. 가는 길에 상하이 1박이 붙어 반나절 시내 관광이 가능해졌고, 지상 13박은 대중교통 우선으로 짜되 최장 이동일은 이틀로 쪼갰고, 카즈베기를 1박으로 줄여 얻은 하루를 카헤티(시그나기)에 넣었으며, 돌아오는 길은 예레반발 새벽 직항 → 아테네 1박 → 아부다비 1박으로 구성했습니다. 공항 노숙 구간은 없습니다.
nights_total: 상하이 1박 + 지상 13박 + 아테네·아부다비 각 1박 = 16박
