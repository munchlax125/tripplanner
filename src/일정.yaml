    - 루브르 아부다비 ↑ 지도 밖
    - 셰이크 자이드 그랜드 모스크
    cap: 루브르는 사디야트 섬이라 실제로는 이 지도 <b>위쪽 바깥(북쪽 약 7km)</b>에 있습니다 — 방향만 맞춰 가장자리에 당겨 표시했습니다. 낮 이동은 전부 택시, 다음 날 새벽 공항행만 A2 버스입니다.
    seq_raw: <b>1</b> 자이드 국제공항 <span class="mapdot">·</span> <b>2</b> TRYP by Wyndham (칼리파 St) <span class="mapdot">·</span> <b>3</b> 루브르 아부다비 <span class="mapdot">·</span> <b>4</b> 셰이크 자이드 그랜드 모스크
  flags:
  - <b>루브르를 먼저, 모스크를 나중에 두는 순서가 중요합니다.</b> 낮 40도를 실내인 루브르에서 흘려보내고, 해가 진 뒤 조명이 켜진 모스크를 보는 배치예요. 순서를 바꾸면 한낮 뙤약볕에 야외 모스크를 걷고, 루브르는 폐장에 쫓깁니다.
  - <b>하필라트(Hafilat) 카드를 도착 즉시 사두세요.</b> 아부다비 버스는 현금을 받지 않습니다. 터미널 A 도착층 자판기·매표소에서 카드 10디르함 + 충전 4디르함이면 됩니다. 두바이 Nol 카드는 쓸 수 없어요. <b>다음 날 새벽 A2를 타려면 전날 밤이 아니라 도착 당일에 사둬야 합니다.</b>
  - <b>A2는 60분 간격입니다.</b> 24시간 운행이라는 자료와 시내→공항 첫차가 05:00이라는 자료가 갈리니, 도착일에 터미널 A 매표소나 DARB 앱에서 새벽 시각표를 확인해두세요. 놓치면 택시(약 90디르함)로 전환하면 되도록 현금·카드를 남겨두면 안전합니다. <b>05:30보다 더 당기지는 마세요</b> — 그 이전 편은 보장되지 않습니다.
- type: border
  title: 아부다비 08:35 → 인천 22:15
  note: 비행 약 8시간 40분 (시차 5시간 포함 소요 13시간 40분). 마지막 구간에서 몰아 자는 것을 목표로.
notes:
- key: 티켓 구조
  val: "<b>항공편은 4장 전부 확정됐습니다.</b> 다만 전부 <b>별도 발권</b>이라 수하물이 이어지지 않습니다 — 구간마다 짐을 찾아 다시 부쳐야 해요. \n      김포→상하이와 푸동→트빌리시는 공항까지 다릅니다. 예레반→아테네는 <b>에게안 A3 3899(XD9TVH)</b>, 아테네→아부다비→인천은 에티하드로 <b>항공사가 달라</b> 아테네에서도 반드시 짐을 찾아 재수속해야 합니다. \n      <b>앞 편이 지연돼도 뒤 편은 보호받지 못합니다.</b> 아테네 환승은 하루를 통째로 두고 가니 안전하지만, 예레반 새벽 편만은 놓치면 대안이 없습니다."
- key: 상하이 공항 이동
  val: 훙차오 IN · 푸동 OUT으로 <b>공항이 다릅니다</b>(약 60km). 시내 숙소를 2호선 라인(난징둥루·인민광장)에 잡으면 훙차오에서 들어오고 푸동으로 나가는 게 둘 다 지하철로 해결됩니다. 2호선은 <b>광란루역에서 열차를 갈아타야</b> 하니 안내 방송을 놓치지 마세요. 급하면 룽양루역에서 자기부상열차(50위안·8분)로 갈아타도 됩니다.
- key: 중국 무비자
  val: 한국 여권은 <b>2026년 12월 31일까지 30일 무비자</b>입니다. 여권만 있으면 되고 별도 신청이 없어요. 다만 한시적 조치라 출발 직전 한 번 더 확인하고, 입국 심사 때 숙소 예약 확인서와 트빌리시행 항공권을 보여줄 수 있게 준비해두세요.
- key: 중국 결제·인터넷
  val: <b>알리페이·위챗페이에 해외 카드를 미리 연동</b>하세요. 현금과 해외 신용카드가 잘 통하지 않습니다. 인터넷은 구글·카카오·인스타가 차단되니 <b>한국 통신사 로밍</b>을 켜두면 우회됩니다(현지 유심을 사면 오히려 막힘). 반나절만 쓰는 구간이라 로밍이 가장 간단합니다.
- key: 아부다비 숙소·교통
  val: "항공권에 포함된 스톱오버 숙박은 <b>TRYP by Wyndham Abu Dhabi City Center</b>(칼리파 bin 자이드 St)로 정했습니다. \n      <b>A2 공항버스가 이 도로에 정차</b>하므로 10/5 새벽 공항행은 버스로 해결됩니다(4디르함 + 하필라트 카드 10디르함). \n      10/4 낮 이동은 루브르와 모스크가 정반대 방향이라 <b>전부 택시</b>로 잡았습니다(합계 약 255디르함). \n      루브르→모스크 구간(약 75디르함)이 가장 비싼데, 여기만 <b>94번 시내버스</b>로 바꾸면 2디르함이지만 60~75분이 걸립니다."
- key: 루브르 아부다비
  val: "<b>월요일 휴관</b>이고 방문일 10/4는 일요일이라 정상 운영입니다. 금~일은 <b>10:00~20:30, 최종 입장 20:00</b>. \n      일반 입장 63디르함. 돔은 자정까지 열려 있어 폐장 후에도 잠시 머물 수 있습니다. 온라인 사전 예매를 권합니다."
- key: 10/2 숙소
  val: 04:25 출발이지만 <b>10/2 밤은 예레반 숙소에서 자고</b> 10/3 새벽 01:30에 공항으로 갑니다. 체크아웃을 새벽에 해야 하니 프런트에 미리 알려두세요.
- key: 새벽 공항 이동
  val: 두 번 다 메트로 첫차보다 이른 시각이지만, <b>양쪽 모두 24시간 공항버스가 있어 택시가 필요 없습니다.</b> 아테네는 <b>X95</b>(04:10, 6.20유로), 아부다비는 <b>A2</b>(05:30, 4디르함). <b>둘 다 야간 60분 간격</b>이니 전날 시각표를 확인하고 정류장에 15분 일찍 도착하세요.
- key: 9/27 합승택시
  val: 오르타찰라에서 08:20 정시편으로 출발합니다. 야간버스로 새벽에 도착하는 바로 그 터미널이라 갈아탈 필요가 없습니다. 전날 숙소를 통해서가 아니라 당일 터미널에서 좌석을 잡아야 하니, 05:20 도착 즉시 매표소부터 확인하세요.
- key: 하흐파트 주말 시간표
  val: 9/27이 일요일이라 <b>9시·13시·17시 3편뿐</b>입니다. 국경을 넘고 <b>13시 편</b>을 타는 일정이라 여유가 있고, 늦어져도 17시 편이 남습니다.
- key: 9/29 타테브 투어
  val: <b>Hyur Service 그룹투어 기준 63.72달러</b>(약 25,000드람)로 <b>입장료와 케이블카까지 포함</b>, 점심만 별도입니다. 08:30 날반댠 96번지 출발 · 22:30~23:30 같은 자리 복귀 · 14~15시간. 케이블카가 월요일 휴무라 화요일(9/29)을 골랐고, <b>예약할 때 그날 운행 여부를 확인</b>하세요. One Way Tour의 타테브·흐른조르·샤키폭포 코스(9,500드람~)가 더 싸지만 코르 비랍과 노라방크가 빠집니다.
- key: 9/26 찰라디 택시
  val: 메스티아→트레일헤드 왕복 택시는 50라리(약 2만 7천원) — 조지아 구간에서 주타 다음으로 큰 단일 지출입니다. 혼자면 전액 부담이니 게스트하우스에서 동행을 구하면 반값이 됩니다.
- key: 예레반 박물관 휴관일
  val: 마테나다란·아르메니아 역사박물관·카페시안 미술관·대학살 추모관 박물관동은 <b>모두 월요일 휴관</b>이고, 마테나다란은 <b>일요일도 쉽니다</b>(화~토 10:00~17:50). 그래서 월요일(9/28)은 알라베르디에서 넘어오는 이동일 + 예레반 도착 후 야외 코스로 잡았습니다. 마테나다란·카페시안은 금요일(10/2)에, 추모관은 목요일(10/1)에 넣었습니다.
- key: 아테네 X95 공항버스
  val: "신타그마 ↔ 공항을 <b>24시간 운행</b>합니다. 요금 <b>6.20유로</b>로 심야 정액택시(55유로)보다 <b>8만원 가까이 쌉니다</b>. \n      다만 <b>야간(22:00~06:00)은 60분 간격</b>이라 하나를 놓치면 치명적이라, 04:10 편을 목표로 <b>03:55까지 정류장에 도착</b>하세요. \n      <b>승차권은 전날 낮에 지하철역에서 미리 사두는 것이 가장 안전합니다</b> — 새벽엔 정류장 매표소가 닫혀 있을 수 있어요(차내 컨택리스 카드 결제도 됩니다). \n      만약 첫 차를 놓치면 정액택시(심야 55유로)로 전환하면 되니, 현금이나 카드는 남겨두세요."
- key: 아크로폴리스 예약
  val: "<b>10/3 09:00~10:00 시간대로 예매 완료.</b> 이 시간대 안이면 언제 들어가도 되고, 10:00까지만 게이트를 통과하면 됩니다. \n      공항 메트로가 36분 간격이라 신타그마 도착이 07:45~08:20으로 흔들리고 아크로폴리스 도착은 <b>08:35~09:15</b>이 됩니다. \n      <b>최악의 경우에도 45분이 남으니 안전권입니다.</b> 이 날 유일하게 시각에 묶인 항목이 풀렸습니다. \n      당일에는 <b>실물 여권</b>과 예매 QR을 함께 준비하세요(이름 대조를 합니다)."
- key: 수면 부족
  val: 상하이 1박 덕분에 초반은 여유가 있지만, <b>9/24·9/26 밤은 각각 야간버스에서 잡니다</b> — 목베개·안대를 상하이 구간뿐 아니라 이 두 밤에도 챙기세요. 돌아오는 길도 <b>10/2 밤~10/3 새벽 기내, 10/4 새벽 기상</b>으로 짧게 끊긴 잠이 이어지니, 마지막 인천행에서 몰아 잘 계획을 세우세요.
- key: 확정 숙소
  val: "상하이 <b>Hi Cozy Hostel</b> 137위안(1박), 트빌리시 <b>Cosy Koala Hostel</b> 58라리 — 라도 아사티아니 13번지, 구시가 안쪽. 아테네 <b>30유로</b>(1박, 신타그마 근처). \n      트빌리시는 <b>9/20~22 3박만 연속으로 예약하면 됩니다</b> — 9/24·9/26 밤은 야간버스라 숙소가 필요 없고, 9/27은 도착해서 몇 시간만 머물다 바로 알라베르디로 넘어가는 날이라 숙박이 없습니다. 대신 메스티아(9/25)와 OmniBus 야간버스 왕복(9/24·9/26, tkt.ge)은 미리 예약해두세요."
- key: 1인 여행 택시
  val: 혼자라 <b>즈바리·게하르트 택시는 전액 부담</b>입니다(합계 약 2만 5천원). 남부(노라방크·할리조르)를 빼면서 1인 택시 부담이 약 7만원에서 여기까지 줄었습니다. 게하르트 구간(3,000드람)은 가르니 광장에서 같이 갈 사람을 찾으면 반값이 되니 한번 말을 붙여보세요.
- key: 지도 사용법
  val: 지도는 <b>파일 안에 그려져 있어 인터넷 없이도 보입니다</b>. 실제 도로 선형, 세반 호수, 데베드 협곡, 주변 도시가 함께 그려져 있고, 왼쪽 아래가 축척, 위가 북쪽입니다. 인터넷이 있을 때 <b>[실제 지도 불러오기]</b>를 누르면 그 자리에서 도로·지명이 다 나오는 지도로 바뀌고, <b>[구글 지도로 열기]</b>는 경유지까지 찍힌 채로 앱에서 열립니다. 일정 본문에서 <b>점선 밑줄이 그어진 관광지 이름</b>을 누르면 구글 지도가 그 좌표를 바로 찍어줍니다. 오프라인 길 찾기는 <b>Organic Maps</b>에 두 나라 지도를 미리 받아 두세요.
- key: 나리칼라 보수
  val: 최근 방문기 중 <b>요새 내부가 보수공사로 막혀 있었다</b>는 것이 있습니다. 케이블카와 '조지아의 어머니' 상 쪽은 열려 있었다고 하니, 9/21에 올라가기 전 숙소에서 현재 상태를 한 번 확인하세요. 능선 산책과 전망은 요새에 못 들어가도 그대로입니다.
- key: 복장
  val: 수도원·성당·모스크는 어깨와 무릎을 가릴 것. 9월 말 카즈베기는 일교차가 크니 바람막이 필수.
foot: 1인 여행 · 지상 이동은 대중교통 우선 · 택시 구간은 즈바리 · 게하르트 · 아부다비 10/4 시내 이동뿐 (아테네·아부다비 새벽 공항행은 모두 공항버스)
