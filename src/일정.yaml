title: 조지아<span class="sep">·</span>아르메니아
subtitle: 9월 19일 – 10월 5일 · 1인 · 상하이 경유 · 트빌리시 IN · 스바네티·카즈베기 · 아테네·아부다비 경유 · 인천 도착
standfirst: 저가 항공 조합으로 예산을 맞춘 대신 이동이 많습니다. 가는 길에 상하이 1박이 붙어 반나절 시내 관광이 가능해졌고, 지상 구간은 <b>대캅카스 두 곳 — 스바네티와 카즈베기</b>에 무게를 실었습니다. 이번 판의 기준은 <b>산에 쓸 수 있는 날을 최대로 만드는 것</b>입니다. 트빌리시↔주그디디를 <b>야간버스 두 번</b>으로 건너뛰어 숙박 2박을 이동으로 바꿨고, 그렇게 번 이틀을 그대로 <b>메스티아 3박</b>에 넣었습니다 — 9~10시간 걸려 가는 곳이라 1박으로는 우쉬굴리도 못 봅니다. 게르게티는 <b>9/27 오후와 9/28 오전</b> 두 번 노립니다 — 카즈베기를 1박으로 줄여 하루를 예레반에 넘긴 결과라, 둘 다 흐리면 세 번째 기회는 없습니다. 아르메니아는 나흘뿐이라 <b>이동만 하는 날을 없애는 데</b> 집중했습니다 — 데베드 협곡의 <b>사나힌·하흐파트</b>는 택시 한 대로, 예레반에 닿는 날 오후엔 <b>에치미아진·즈바르트노츠</b>, 마지막 날 아침엔 <b>호르 비랍</b>에서 아라라트를 봅니다. 돌아오는 길은 예레반발 새벽 직항 → 아테네 1박 → 아부다비 1박이고, 공항 노숙 구간은 없습니다.
nights_total: 상하이 1박 + 지상 11박 + 야간버스 2회 + 아테네·아부다비 각 1박 = 16박
