notes:
- key: 야간버스 — 출발 전 반드시 확인
  val: 이 일정은 <b>트빌리시↔주그디디 야간버스</b>(OmniBus, 자정 발, 각 30라리)로 이틀을 법니다. 다만 <b>고속도로 야간 보수공사로 운행이 중단됐다는 보고</b>가 있으니 출발 2~3일 전에 OmniBus 홈페이지나 TKT.GE 에서 그 날짜 표가 팔리는지 확인하세요. 안 뜨더라도 <b>날짜 배열은 그대로</b>입니다 — 트빌리시에서 하룻밤 더 자고 다음 날 디두베에서 메스티아 직행 마르슈르트카(07:00, 9시간, 50라리)를 타면 됩니다. 숙소 2박(약 3만원)이 늘고 스바네티 반나절을 잃는 것이 전부입니다.
- key: 스바네티 현금
  val: 메스티아는 ATM 이 있지만 고장 나 있을 때가 있고, 게스트하우스·지프 기사·식당 상당수가 <b>현금만</b> 받습니다. 트빌리시를 떠나기 전에 <b>300~400라리</b>를 뽑아 가세요. 우쉬굴리는 더합니다 — 카드가 되는 곳이 사실상 없습니다.
- key: 우쉬굴리 길
  val: 메스티아–우쉬굴리 46km 는 비포장 산길이라 <b>4WD 라야 갑니다</b>(공유 지프 40~50라리). 9월 말은 대체로 열려 있지만 비가 오래 오거나 첫눈이 이르면 끊깁니다. <b>전날 저녁 세티 광장에서 기사에게 길 상태를 물어보세요</b> — 가장 정확한 정보원입니다. 무산되면 9/25 와 바꿀 수 있게 메스티아 3박의 가운데에 두었습니다.
- key: 중국 결제·인터넷
  val: <b>알리페이·위챗페이에 해외 카드를 미리 연동</b>하세요. 현금과 해외 신용카드가 잘 통하지 않습니다. 인터넷은 구글·카카오·인스타가 차단되니 <b>한국 통신사 로밍</b>을 켜두면 우회됩니다(현지 유심을 사면 오히려 막힘). 반나절만 쓰는 구간이라 로밍이 가장 간단합니다.
- key: 아부다비 숙소·교통
  val: "항공권에 포함된 스톱오버 숙박은 <b>TRYP by Wyndham Abu Dhabi City Center</b>(칼리파 bin 자이드 St)로 정했습니다. \n      <b>A2 공항버스가 이 도로에 정차</b>하므로 10/5 새벽 공항행은 버스로 해결됩니다(4디르함 + 하필라트 카드 10디르함). \n      10/4 낮 이동은 루브르와 모스크가 정반대 방향이라 <b>전부 택시</b>로 잡았습니다(합계 약 255디르함). \n      루브르→모스크 구간(약 75디르함)이 가장 비싼데, 여기만 <b>94번 시내버스</b>로 바꾸면 2디르함이지만 60~75분이 걸립니다."
- key: 루브르 아부다비
  val: "<b>월요일 휴관</b>이고 방문일 10/4는 일요일이라 정상 운영입니다. 금~일은 <b>10:00~20:30, 최종 입장 20:00</b>. \n      일반 입장 63디르함. 돔은 자정까지 열려 있어 폐장 후에도 잠시 머물 수 있습니다. 온라인 사전 예매를 권합니다."
- key: 10/2 숙소
  val: 04:25 출발이지만 <b>10/2 밤은 예레반 숙소에서 자고</b> 10/3 새벽 01:30에 공항으로 갑니다. 체크아웃을 새벽에 해야 하니 프런트에 미리 알려두세요.
- key: 새벽 공항 이동
  val: 두 번 다 메트로 첫차보다 이른 시각이지만, <b>양쪽 모두 24시간 공항버스가 있어 택시가 필요 없습니다.</b> 아테네는 <b>X95</b>(04:10, 6.20유로), 아부다비는 <b>A2</b>(05:30, 4디르함). <b>둘 다 야간 60분 간격</b>이니 전날 시각표를 확인하고 정류장에 15분 일찍 도착하세요.
- key: 9/29 합승택시
  val: 오르타찰라에서 <b>08:20 정시편</b>으로 출발합니다. 예레반행은 <b>08:20과 10:20 두 편이 승객 수와 상관없이 정시에 떠나고</b>, 그 뒤로는 차면 출발합니다 — 08:20을 놓쳐도 10:20이 있습니다. 트빌리시 숙소에서 지하철로 20분이니 07:30에 나서면 됩니다. 기사에게 <b>알라베르디에서 내린다고 미리</b> 말해 두세요 — 대부분 예레반까지 논스톱으로 갑니다.
- key: 하흐파트·사나힌 가는 법
  val: 두 수도원은 <b>함께 유네스코에 등재된 형제 수도원</b>이고, 데베드 협곡 양쪽 고원에 하나씩 있어 버스로는 협곡 바닥의 알라베르디를 두 번 오르내려야 합니다. 그래서 <b>알라베르디 도착 직후 택시 한 대를 통째로</b> 잡습니다 — 대기 포함 6,000드람 안팎. 가까운 <b>사나힌을 먼저</b>, 건물이 흩어진 <b>하흐파트에 시간을 더</b> 쓰고, 돌아와 시내의 12세기 사나힌 다리까지 봅니다. 입장료는 둘 다 없습니다.
- key: 아테네 X95 공항버스
  val: "신타그마 ↔ 공항을 <b>24시간 운행</b>합니다. 요금 <b>6.20유로</b>로 심야 정액택시(55유로)보다 <b>8만원 가까이 쌉니다</b>. \n      다만 <b>야간(22:00~06:00)은 60분 간격</b>이라 하나를 놓치면 치명적이라, 04:10 편을 목표로 <b>03:55까지 정류장에 도착</b>하세요. \n      <b>승차권은 전날 낮에 지하철역에서 미리 사두는 것이 가장 안전합니다</b> — 새벽엔 정류장 매표소가 닫혀 있을 수 있어요(차내 컨택리스 카드 결제도 됩니다). \n      만약 첫 차를 놓치면 정액택시(심야 55유로)로 전환하면 되니, 현금이나 카드는 남겨두세요."
- key: 아크로폴리스 예약
  val: "<b>10/3 09:00~10:00 시간대로 예매 완료.</b> 이 시간대 안이면 언제 들어가도 되고, 10:00까지만 게이트를 통과하면 됩니다. \n      공항 메트로가 36분 간격이라 신타그마 도착이 07:45~08:20으로 흔들리고 아크로폴리스 도착은 <b>08:35~09:15</b>이 됩니다. \n      <b>최악의 경우에도 45분이 남으니 안전권입니다.</b> 이 날 유일하게 시각에 묶인 항목이 풀렸습니다. \n      당일에는 <b>실물 여권</b>과 예매 QR을 함께 준비하세요(이름 대조를 합니다)."
- key: 수면 부족
  val: '상하이 1박 덕분에 초반은 여유가 있지만, <b>이번 판에는 야간버스가 두 번</b> 들어 있습니다 — 9/22 밤(트빌리시→주그디디)과 9/26 밤(주그디디→트빌리시)입니다. 특히 <b>9/27</b>이 고비입니다: 06:00에 버스에서 내려 그대로 디두베로 옮겨 카즈베기행 마르슈르트카를 4시간 더 탑니다. 그날 게르게티는 오후로 미뤄 두었지만, 카즈베기가 1박이라 <b>건너뛰면 기회가 다음 날 오전 한 번만 남습니다</b>. 마지막도 몰립니다: 10/2 밤 01:30 기상 → 10/3 새벽 기내 → 10/4 새벽 기상. <b>버스에서 자는 연습</b>이라 생각하고 목베개와 안대를 챙기세요.'
- key: 1인 여행 택시
  val: 혼자라 택시·지프 비용을 나눌 사람이 없습니다. 전액 부담이 되는 구간은 <b>즈바리(25라리) · 우쉬굴리 왕복(40~50라리) · 코룰디 4WD(60라리) · 게르게티 4WD(25라리) · 알라베르디 수도원 택시(6,000드람) · 게하르트(3,000드람) · 호르 비랍 왕복(12,000드람)</b>입니다. 이 중 <b>코룰디가 가장 큽니다</b> — 9/25 에 B안(찰라디)을 고르면 택시 30라리로 줄어듭니다. <b>우쉬굴리는 원래 공유 지프</b>라 1인 요금이고, 자리가 안 차면 출발이 늦어질 뿐 값이 오르지는 않습니다. 게하르트도 가르니 광장에서 같이 갈 사람을 찾으면 나눌 수 있습니다.
- key: 나리칼라 보수
  val: 최근 방문기 중 <b>요새 내부가 보수공사로 막혀 있었다</b>는 것이 있습니다. 케이블카와 '조지아의 어머니' 상 쪽은 열려 있었다고 하니, 9/21에 올라가기 전 숙소에서 현재 상태를 한 번 확인하세요. 능선 산책과 전망은 요새에 못 들어가도 그대로입니다.
- key: 복장
  val: 수도원·성당·모스크는 어깨와 무릎을 가릴 것. 9월 말 카즈베기는 일교차가 크니 바람막이 필수.
- key: GG 택시 앱
  val: 예레반 시내 이동과 10/3 새벽 공항행은 <b>GG 앱</b>으로 잡습니다. 길에서 잡는 택시보다 훨씬 싸고(시내 600~1,500드람) 새벽에도 잡힙니다. <b>출국 전에 설치</b>해 두세요.
foot: 1인 여행 · 지상 이동은 대중교통 우선 · 야간버스 2회(트빌리시↔주그디디) · 택시가 꼭 필요한 곳은 즈바리 · 게르게티 · 우쉬굴리 · 코룰디 · 알라베르디 수도원 · 게하르트 · 호르 비랍과 아부다비 10/4 시내 이동
