  - <b>오늘 하루의 유일한 관문은 예원 16:30 폐장입니다.</b> 매표 마감은 그보다 이르니 16시 전에는 들어가야 해요. 입국 심사가 밀려 15:30을 넘길 것 같으면 <b>체크인을 건너뛰고 10호선으로 예원역까지 직행</b>하세요(짐은 상가 물품보관함 또는 저녁에 숙소로). 그래도 못 들어가면 <b>담장 밖 예원 라오제와 성황묘는 밤에 더 좋습니다</b> — 등롱 조명이 들어오면 정원 안보다 오히려 인상적이라는 평이 많아요.
  - <b>알리페이 또는 위챗페이를 출발 전에 반드시 세팅</b>하세요. 상하이는 노점·지하철·택시까지 QR 결제가 기본이고 해외 신용카드는 거부되는 곳이 많습니다. 두 앱 모두 해외 카드 연동이 되니 한국에서 미리 등록하고 소액 결제로 작동을 확인해두세요. 인터넷은 구글·카카오가 차단되니 <b>한국 통신사 로밍</b>을 켜두면 우회됩니다.
  - 체력이 남으면 저녁 후 <b>황푸강 야경 유람선</b>(120위안, 40분)을, 조용한 쪽이 좋으면 <b>신톈디</b>(10호선 두 정거장)를 붙이세요. 반대로 지치면 예원을 버리고 와이탄 야경 하나만 봐도 충분합니다.
