overview_cap: 트빌리시 IN → 카즈베기 → 스바네티(주그디디·메스티아, 야간버스 왕복) → 국경 → 알라베르디 → 예레반 붙박이 → 남부 당일 왕복. 번호는 방문 순서이고, 트빌리시·주그디디·예레반은 두 번 이상 거칩니다. <b>11~13번(코르 비랍 · 노라방크 · 타테브)은 9/29 하루에 투어로 한 번에 도는 구간</b>입니다. 가르니·게하르트(9/30)와 에치미아진(10/1)은 예레반에서 20km 안이라 이 축척에서는 겹쳐 따로 찍지 않았습니다.
