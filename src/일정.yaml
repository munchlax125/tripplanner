title: 조지아<span class="sep">·</span>아르메니아
subtitle: 9월 19일 – 10월 5일 · 1인 · 상하이 경유 · 트빌리시 IN · 아테네·아부다비 경유 · 인천 도착
standfirst: 저가 항공 조합으로 예산을 맞춘 대신 이동이 많습니다. 가는 길에 상하이 1박이 붙어 반나절 시내 관광이 가능해졌고, 지상 13박은 대중교통 우선으로 짰습니다. 이번 판의 기준은 <b>날씨와 시간표에 인질로 잡히지 않는 것</b>입니다 — 가장 불확실한 게르게티를 위해 <b>카즈베기를 2박</b>으로 두어 볼 기회를 세 번으로 늘렸고, 무리한 야간버스는 넣지 않았습니다. 조지아는 트빌리시를 축으로 므츠헤타·시그나기를 당일로 다녀오고, 아르메니아는 국경을 넘어 <b>알라베르디 → 딜리잔 → 세반</b>으로 북부를 훑으며 내려간 뒤 예레반에 <b>4박 붙박이</b>로 앉아 남부와 근교를 당일 왕복합니다. 돌아오는 길은 예레반발 새벽 직항 → 아테네 1박 → 아부다비 1박입니다. 공항 노숙 구간은 없습니다.
nights_total: 상하이 1박 + 지상 13박 + 아테네·아부다비 각 1박 = 16박
