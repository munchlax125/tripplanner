- type: day
  cls: day cn stay
  date: '9.19'
  dow: 토
  place: 상하이 <span class="tag">훙차오 12:55 도착</span>
  sub: 경유가 아니라 반나절짜리 하루가 생겼습니다. 예원에서 와이탄까지 한 줄로 걷는 코스.
  sched:
  - label: null
    rows:
    - t: '12:55'
      text: 훙차오 국제공항 T1 도착
    - t: '13:35'
      text: 입국 수속 · 짐 수령
      small:
      - 별도 발권이라 짐은 여기서 한 번 찾습니다
    - t: '13:50'
      bus: 지하철 10호선
      text: 난징둥루역
      small:
      - 5위안 · 45분 · T1역에서 바로 승차, 환승 없음
    - t: '14:40'
      text: Hi Cozy 호스텔 체크인 — 짐만 두고 바로 출발
      small:
      - 난징둥루역 도보권. 옥상 공용 라운지가 좋다는 평
    - t: '15:15'
      bus: 10호선 한 정거장
      text: 예원역
      small:
      - 또는 도보 20분
    - t: '15:30'
      text: 예원 (豫园)
      tag:
        text: 16:30 폐장
        hot: true
      small:
      - 40위안 · 명·청대 강남 정원. 좁은 회랑이 계속 꺾이며 풍경을 바꾸는 구조
    - t: '16:40'
      text: 예원 라오제 — 난샹만터우뎬 샤오롱바오
      small:
      - 정원 담장 밖 상가. 1900년대 초부터 있던 원조 지점이 여기
    - t: '17:10'
      text: 상하이 성황묘
      small:
      - 도교 사원. 해가 지면 붉은 조명이 들어와 낮과 완전히 다릅니다
    - t: '17:40'
      text: 와이탄까지 도보
      small:
      - 15분. 옛 성곽 골목을 빠져나오면 갑자기 강변
    - t: '17:50'
      text: 황푸강변 일몰 · 조계지 석조 건물 열
    - t: '18:30'
      text: 푸동 스카이라인 야경 점등
      small:
      - 이 시간대가 상하이에서 가장 볼 만한 장면
    - t: '19:15'
      text: 난징둥루 보행가로 걸어 돌아오며 저녁
      small:
      - 훙사오러우, 성젠바오. 보행가 큰길보다 한 블록 안쪽이 낫습니다
    - t: '21:00'
      text: 숙소 복귀 · 취침
      small:
      - 36시간 이동의 중간 지점. 여기서 자두는 게 이번 일정의 핵심
    - t: 07:30
      text: 기상 · 조식
      small:
      - 날짜가 9/20으로 넘어갑니다
    - t: 08:30
      text: 체크아웃
    - t: 08:50
      bus: 지하철 2호선
      text: 푸동 국제공항
      small:
      - 8위안 · 1시간 15분 · 광란루역에서 열차를 갈아타야 함(같은 2호선이지만 운행이 끊김)
    - t: '10:15'
      text: 푸동공항 도착 · 체크인
      small:
      - 12:50 출발 기준 2시간 35분 전
