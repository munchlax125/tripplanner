transport_notes:
- 아부다비 10/4는 루브르(사디야트, 북쪽)와 모스크(알 마크타, 남쪽)가 정반대 방향이라 전 구간 택시로 잡았습니다. 루브르→모스크만 94번 버스로 바꾸면 75→2디르함이지만 60~75분이 걸립니다.
- 9/28 바나조르→딜리잔 요금(800드람)은 노선 거리에 준한 추정치입니다. 시간표를 확정된 형태로 찾지 못했으니 알라베르디 숙소나 바나조르 터미널에서 확인하세요. 최악의 경우 택시로 넘어가도 6,000~8,000드람이라 하루가 무너지지는 않습니다.
- 이번 일정에는 야간버스가 없습니다. 지상 13박이 전부 숙박이라 교통비는 늘고 숙박비도 함께 늘었지만, 운행 취소로 일정이 연쇄로 무너질 구간이 사라졌습니다.
