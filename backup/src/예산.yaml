- ※ 여행자보험·유심(중국은 로밍 권장 / 조지아·아르메니아·그리스·UAE 각각)·기념품·와인 구매 등은 별도 고려하세요.
- ※ 확정 숙소 — 상하이 Hi Cozy International Youth Hostel 137위안/1박(황푸구, 난징둥루역 도보권), 트빌리시 Cosy Koala Hostel 58라리. 트빌리시는 9/20~22 3박과 9/25~26 2박으로 나뉩니다 — 같은 곳을 두 번 잡으면 카즈베기 다녀오는 동안 짐을 맡길 수 있습니다.
- ※ 미예약 숙소(카즈베기 2박·알라베르디·딜리잔·예레반 4박)는 도미토리 기준 추정치입니다. 개인실을 잡으면 1인 여행이라 이 금액의 두 배 가까이 올라갑니다.
- ※ 아테네 숙소는 30유로/1박 확정 — 신타그마 근처. 08:00 짐 보관이 가능한 곳이어야 합니다(아크로폴리스 큰 가방 반입 불가).
- ※ 아부다비 숙소는 TRYP by Wyndham Abu Dhabi City Center(칼리파 bin 자이드 St) — 항공권 스톱오버에 포함되어 숙박비 0원. A2 공항버스가 이 도로에 정차합니다.
- ※ 9/24 주타는 대중교통이 없어 4WD 택시 왕복 80라리(1인 전액)로, 지상 구간 단일 최대 지출입니다. 카즈베기 게스트하우스에서 동행을 구하면 40라리로 줄어듭니다.
- ※ 카즈베기를 2박으로 늘리면서 숙박이 하루 늘었습니다(약 2만 8천원). 게르게티를 못 보고 내려올 위험을 그 값에 산 셈입니다.
